# 주제(topic) 카탈로그 — 소셜 신호는 "어느 주제를 볼지"까지만 정합니다.
#
# 출발 키트 05 "주제 고르는 법"의 B 방식:
#   소셜 신호 → 주제 지정 → 그 주제의 정책을 전부 모으기(법령·조례·고시) → 3개 관문 → 계획 먼저 → 효과 추정
#   소셜 신호는 분석 대상을 고르는 데 쓰지 않고, ① 주제 좁히기 ② 선반영(미리 반응) 점검 ③ 관심도 자체를 결과로 — 에만 씁니다.
#
# collect: 정책 목록을 모으는 방법
#   law_ordinance : 법제처 자치법규 API로 조례 제정일·지자체를 자동 수집 (query 사용)
#   notice        : 부처·지자체 고시문에서 지정·해제 이력을 수집 (에이전트 과제)
#   curated       : 카탈로그에 적은 정책만 (전국 단위 등)

version: 1
topics:
  - id: traffic-operations
    name: 도로교통 운영
    question: 버스 운행·차로·정류장 조정 전후 일반도로의 교통 흐름은 어떻게 달라졌나?
    keywords: [교통, 강남대로, 버스, 통행속도, TOPIS, 버스전용차로, 정류장, 혼잡]
    policies: []
    collect:
      method: curated
      note: "첫 사례는 2024년 강남대로 광역버스 분산. 시행 안내와 실제 구간·노출 이력을 별도로 검증"
    legal:
      laws: [도로교통법, 여객자동차 운수사업법]
      admin_rules: []
      note: "개별 노선·정류장 조정은 당시 교통행정 자료로 확인. 일반 법률의 시행일을 정책 처치일로 사용하지 않음"
    events:
      - date: 2024-06-29
        what: "강남·명동 광역버스 노선 조정 안내상 시행일"
        source: "https://mediahub.seoul.go.kr/archives/2011484"
    gates:
      when: {status: check, note: "안내상 날짜 확인. 실제 적용 구간·예외는 추가 검증"}
      who: {status: check, note: "비교 도로의 비노출·우회 영향 미확인"}
      what: {status: check, note: "TOPIS 월별 XLSX 확보. 시간·결측 정의와 개별 이용 조건 확인 필요"}
    pitfalls:
      - "일반도로 속도와 버스 승객 통행시간은 다른 지표"
      - "한 처치 도로의 여러 링크를 독립 처치 표본으로 세지 않음"
      - "동시 정책·장마·공사·도로 메타데이터 변경을 구분해야 함"

  - id: digital-inclusion
