  - id: local-gov-merger
    name: 지방자치단체·공공기관 통폐합
    question: 행정구역 통합(또는 기관 통폐합·분리)은 약속한 대로 인구·재정·행정 효율을 바꿨나?
    keywords: [통합, 통폐합, 행정구역 통합, 창원, 마산, 진해, 마창진, 청주, 청원, 통합시, 특례시, 분리, 기관 통합, 공공기관 통폐합, KTX, SRT, 철도 통합]
    policies: [T9]
    collect:
      method: curated
      note: "통합은 사례마다 별도 법률(설치 및 지원특례법)로 시행되어 처치 단위가 1~2곳. 사례를 모아 같은 틀(통합 전 옛 시 합산 → 동일 경계, 전환연도 제외, placebo-in-space·합성통제)로 비교"
    legal:
      laws: [경상남도 창원시 설치 및 지원특례에 관한 법률, 충청북도 청주시 설치 및 지원특례에 관한 법률]
      admin_rules: []
      note: "통합 인센티브(보통교부세 특례 등)는 지방교부세법 시행령에 흩어져 있어 수동 확인. 공공기관 통폐합(KTX·SRT 등)은 법령이 아닌 정부 결정이라 events 에 출처와 함께 적는다"
    events:
      - {date: 2010-03-12, what: "경상남도 창원시 설치 및 지원특례에 관한 법률 공포 (법률 제10052호)"}
      - {date: 2010-07-01, what: "마산·창원·진해 → 통합 창원시 출범"}
      - {date: 2014-07-01, what: "청주시·청원군 → 통합 청주시 출범"}
      - {date: 2022-01-13, what: "창원·수원·고양·용인 특례시 출범 (지방자치법 전부개정 시행)"}
    gates:
      when: {status: pass, note: "법률 공포·시행일로 확정"}
      who: {status: check, note: "처치 단위 1곳 → 무작위화 추론·합성통제. 2001~2023 경계가 바뀌지 않은 기초 시가 대조군"}
      what: {status: key, note: "KOSIS 주민등록인구·이동자수·e-지방지표 — 무료 키 필요"}
    pitfalls: ["통합 전후 경계가 달라 옛 시 자료를 합산해야 함(비율 지표는 가중 평균)", "통합 연도는 반년만 처치 → 전환연도 제외", "통합 인센티브(교부세 특례)가 함께 들어와 '통합 패키지' 효과로 해석", "인접 시로의 인구·세원 이동(파급) → 인접 시 제외"]
