    legal:
      laws: [디지털포용법, 지능정보화 기본법, 장애인차별금지 및 권리구제 등에 관한 법률]
      admin_rules: []
      note: "관련 법률 탐색의 출발점. 법령 스냅샷·대상별 적용일·검증기준 및 지원사업 이력은 아직 이 저장소에 수집하지 않음"
    events:
      - date: 2026-01-22
        what: "디지털포용법 시행 (대상별 처치일과 동일하다고 가정하지 않음)"
        source: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=268533&efYd=20260122"
    gates:
      when: {status: check, note: "법 시행일은 확인. 대상별 적용·유예와 실제 도입 시점은 별도 검증 필요"}
      who: {status: check, note: "비교 가능한 처치·대조군 미확보. 취약계층 집단들을 독립 대조군으로 사용하지 않음"}
      what: {status: check, note: "기존 탐색 자료는 이용자 기준선·기기 현황·조달 흐름. 시행 후 이용자 통계와 기기 과거 이력은 미확보"}
    pitfalls:
      - "기존 a11y 분석은 결과를 본 탐색 분석이며 사전 등록 분석이 아님"
      - "이용자 연간 상대지수·기기별 현황·조달 변경 기록은 단위가 달라 하나의 패널로 직접 결합할 수 없음"
      - "납품요구 순증은 실제 납품·설치·배리어프리 인증 대수가 아님"
      - "동시 정책·지원사업·선행 대응을 분리하지 못하면 변화 전체를 법 효과로 해석할 수 없음"

  - id: housing-regulation
