    search_terms: [교통사고 통계, 보행자 교통사고]
    pitfalls: ["조기 도입 지자체 일자 확인 필요", "민식이법(2020.3)·코로나19와 겹침", "사고다발지역 API는 결과로 선택된 표본이라 결과지표로 쓰면 안 됨"]

  - id: T5
    name: 민식이법 (어린이보호구역)
    keywords: [민식이법, 스쿨존, 어린이보호구역, 어린이 교통사고, 단속카메라]
    summary: 2020.3.25 시행. 코로나19 등교 중단과 시점이 겹쳐 식별이 어려운 교육용 사례.
