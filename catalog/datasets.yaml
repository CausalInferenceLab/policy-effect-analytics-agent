  - 신청방법
  roles:
  - treatment
  topics:
  - birth-marriage
  notes: >-
    복지로 기반 REST/XML API로 목록조회·상세조회를 제공한다. 개별 단위는 사람이 아닌 복지사업이다.
    서울 관련 재제공 경로는 서울 열린데이터광장 OA-23013(목록), OA-23014(상세)이며 같은 원천이다.
    서울시 자치구별 자체 출산지원금 사업을 선별하는 출발 자료로 사용한다.
    treatment는 정책 정보 구축용 역할이며 실제 수급자·지급액 또는 검증된 처치 이력을 뜻하지 않는다.
    지원금액·자녀 순위·거주요건은 상세 내용과 자치구 공식 안내를 대조하고,
    적용 시작일·종료일은 조례 부칙·공고·보도자료로 별도 확인한다.
    2026-10-19 API 실호출로 서울 복지사업 목록 397건과 출산 관련 후보 상세 56건을 수집했다.
    전체 목록에는 25개 구가 모두 있으나 출산 관련 후보는 20개 구에만 검색되었다.
    후보에는 서울시·교육청 및 현물·의료 지원 등이 포함되므로 자체 현금지원 사업 수로 해석하지 않는다.
    과거 정책 이력과 자체 출산지원금의 25개 구 포괄 여부는 별도 확인이 필요하다.
    작업 범위와 출처 연결은 cases/ingyeoking13-seoul-birth-support/README.md 참고.
  verified: 2026-10-19 공공데이터포털 명세와 인증 API 목록·상세 응답 확인; 서울 재제공 페이지 설명은 2026-10-13 확인
