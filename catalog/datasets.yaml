  topics: [digital-inclusion]
  notes: >-
    기관 127의 DT_12017N008·DT_12017N009·DT_12017N0010·DT_12017N0011 네 표.
    일반국민=100 상대지수이며 100은 상한이 아니다. 조사연도와 발표·수정일을 구분한다.
    2014~2015는 지표·대상 기준 변경 때문에 주 비교에서 분리한다.
    outcome은 후보 역할이며 시행 후 관측 확보나 효과 식별을 뜻하지 않는다.
    기존 조사에서는 시행 후 연간 값이 없었다. 원자료·수집 코드는 이번에 이관하지 않는다.
