#
# 한 데이터셋이 분석에서 맡는 역할(roles)
#   treatment : 누가·언제 정책을 받았나 (처치)
#   outcome   : 무엇이 달라졌나 (결과)
#   covariate : 결과에 영향을 주는 다른 요인 (통제)
# 단위: space(전국·시도·시군구·읍면동·지점·개별) × time(일·주·월·분기·연·수시)
