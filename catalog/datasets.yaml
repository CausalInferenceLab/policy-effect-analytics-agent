# license: KOGL-1~4(공공누리) | other(포털 표기 "이용허락범위 제한 없음" 등, license_note 참고) | 확인필요
# verified: 사람이(또는 에이전트가) 원본 페이지를 열어 확인한 날짜와 방법. 확인하지 못한 값은 '확인필요'.
