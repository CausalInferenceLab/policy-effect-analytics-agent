    how: "법정동코드 앞 5자리로 자치구 매핑 → 계약년월별 건수·㎡당 가격 중위값. 해제 거래(cdealType=O) 제외, 지정 효력일이 월 중간인 2025-03은 전환월로 제외"
    keys: [gu_code, month_idx]

  - id: treat_table
    kind: transform
    label: "처치표 (구 × 첫 처치 월)"
    inputs: [designation, speculation_zone]
    how: "지정 4개 구 treated=1, 첫 처치 월 2025-04(month_idx 15). 2025-10 전역 지정 이후 기간은 제외"
    keys: [gu_code]

  - id: log_trades
    kind: metric
    label: "아파트 매매 거래건수(로그)"
    inputs: [gu_month, treat_table]
    how: "log(1 + 자치구·계약월별 매매 건수)"
    used_by: [t3-land-permit-2025]

  - id: log_price_m2
    kind: metric
    label: "㎡당 거래가격 중위값(로그)"
    inputs: [gu_month, treat_table]
    how: "log(거래금액 ÷ 전용면적의 자치구·월별 중위값)"
    used_by: [t3-land-permit-2025]
