id: t3-land-permit-2025
owner: jsshin2022
topic: housing-regulation
title: "토허구역 확대 지정 → 강남 4구 아파트 거래량·가격"
question: "2025.3.24 강남·서초·송파·용산 전역 지정 뒤 이 4개 구의 아파트 거래가 나머지 21개 구와 비교해 달라졌나?"
steps:
  - id: issue
    kind: issue
    ref: seoul-ltp-gangnam-2025

  - id: designation
    kind: policy
    label: "강남·서초·송파·용산 토지거래허가구역 전역 지정"
    date: "2025-03-24"
    source: "https://www.korea.kr/news/policyNewsView.do?newsId=148940714"
    note: "서울시·국토부 공고라 법제처 DB에는 없음 → 정부 발표로 날짜 확인"

  - id: speculation_zone
    kind: policy
    ref: "투기과열지구 지정"
    date: "2025-10-16"
    note: "10·15 대책으로 서울 전역이 규제지역이 되어 대조군이 사라짐 → 분석 기간을 2025-09까지로 자른 이유"

  - id: raw_trades
    kind: dataset
    ref: "15126468"
    note: "아파트 매매 실거래 (계약일·법정동·거래금액·전용면적·해제여부)"

  - id: gu_month
    kind: transform
    label: "자치구 × 계약월 집계"
