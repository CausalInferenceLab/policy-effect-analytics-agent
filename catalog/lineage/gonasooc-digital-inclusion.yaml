# 트랙 A: 기존 탐색 자료의 출처와 후속 재현 경로. 사전 등록·정책 효과 추정 결과가 아니다.
# 원본 고정 버전: https://github.com/gonasooc/a11y/tree/c45a5a16276e845f0b025cd7692138b1d44624a7
# 기존 plan.json도 preregistered: false. 이 PR은 원자료·산출값·수집 코드를 이관하지 않는다.
# done은 출처 연결 완료, planned는 이 저장소에서 재현할 단계, missing은 미확보 자료다.
id: gonasooc-digital-inclusion
owner: gonasooc
topic: digital-inclusion
title: 디지털포용 정책 — 이용자 기준선·기기 현황·공공조달의 계보와 관측 공백
question: 공개 자료로 확인할 수 있는 변화와 정책 효과 판단에 부족한 자료는 무엇인가?
steps:
  - id: policy_start
    kind: policy
    label: 디지털포용법 시행
    date: "2026-01-22"
    source: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=268533&efYd=20260122"
    note: >-
      2026-10-22 국가법령정보센터 시행일 확인. 법 시행일을 모든 대상의 처치일로 쓰지 않는다.
      기존 접근성 의무·지원사업과 대상별 적용·유예·검증기준 이력은 추가 확인이 필요하다.

  - id: kosis_baseline
    kind: dataset
    ref: kosis-digital-divide
    note: "기존 수집 기록은 2014~2025 조사연도. 최신 원문·이용 조건 재확인 미완료. done은 출처 연결이며 이번 PR의 재수집 완료를 뜻하지 않음"
  - id: mois_snapshot
    kind: dataset
    ref: '15154774'
    note: "기존 수집일 2026-10-03의 무인민원발급기 현황. 이 PR은 원자료를 포함하지 않음"
  - id: pps_records
    kind: dataset
    ref: '15129471'
    note: "기존 수집 범위 2025-01~2026-09. 등록과 납품요구 변경은 단위가 달라 각각 처리"

  - id: kosis_series
    kind: transform
    status: planned
    label: 조사연도·지표·집단별 기준선 정리
    inputs: [kosis_baseline]
    keys: [table_id, population, survey_year]
    how: >-
      종합·접근·역량·활용 네 표를 조사연도로 정렬하고 2016~2025를 주 비교로 삼는다.
      2014~2015는 기준 변경으로 분리한다. 결측·통계부호는 0으로 대체하지 않는다.
      기존 보고서와 API 값의 불일치는 출처를 함께 남기고 임의 접합하지 않는다.
    source: https://github.com/gonasooc/a11y/blob/c45a5a16276e845f0b025cd7692138b1d44624a7/analyses/digital-inclusion/kosis_analyze.py
    note: "keys는 정규화 후 논리 키. 이 저장소의 수집·재현 코드는 후속 작업"
  - id: baseline_change
    kind: metric
    status: planned
    label: 시행 전 상대지수 변화
    inputs: [kosis_series]
    how: "같은 지표·집단의 끝연도 값 − 시작연도 값(지수 포인트). 연평균 변화는 이를 연도 간격으로 나눈다"
    used_by: []
    note: "일반국민=100은 매년 달라지는 상대 기준. 집단 간 중복·구성 차이가 있어 처치·대조군 비교나 정책 효과로 해석하지 않음"

  - id: mois_used_records
    kind: transform
    status: planned
    label: 사용 기재 기기의 기능별 현황
    inputs: [mois_snapshot]
    keys: [OPN_ATMY_GRP_CD, MNG_NO]
    how: >-
      키 누락·상충 중복은 제외하고 완전 동일 중복은 제거한다. 의미를 검증하지 못한 갱신코드 D는 격리한다.
      사용 여부가 명시된 사용 기기를 분모로 삼고 기능별 제공·미제공·미상을 정확한 값으로 구분한다.
      지역 코드 변경·갱신 지연을 점검하며 데이터 수정일을 설치일로 사용하지 않는다.
    source: https://github.com/gonasooc/a11y/blob/c45a5a16276e845f0b025cd7692138b1d44624a7/analyses/digital-inclusion/mois_analyze.py
  - id: feature_share
    kind: metric
    status: planned
    label: 기능별 제공 기재 비율
    inputs: [mois_used_records]
    how: "기능별 제공 기재 기기 수 ÷ 사용 기재 기기 수 × 100. 미제공·미상 건수를 별도 표시하고 분모 0이면 미산출"
    used_by: []
    note: "행정자료에 적힌 현재 상태이며 현장 작동률·법 준수율·시행 전후 효과가 아님"

  - id: pps_monthly
    kind: transform
    status: planned
    label: 납품요구 변경 기록의 접수월별 집계
    inputs: [pps_records]
    keys: [dlvrReqNo, dlvrReqChgOrd, prdctSno]
    how: >-
      월별 응답 건수·페이지·해시·키 중복을 검사한다. 세부품명 4321151401(증명발급기)·4321151402(무인안내시스템)를 선택한다.
      접수일(dlvrReqRcptDate) 기준 모든 변경차수의 incdecQty·incdecAmt를 부호 그대로 합산한다.
      수량은 단위가 대이고 대표품목인 행만 사용한다. 금액은 옵션·단위를 구분해 범위를 명시한다.
      등록 자료는 별도 기술통계로 보며 납품요구와 행 단위로 직접 합치지 않는다.
    source: https://github.com/gonasooc/a11y/blob/c45a5a16276e845f0b025cd7692138b1d44624a7/analyses/digital-inclusion/pps_analyze.py
  - id: procurement_change
    kind: metric
    status: planned
    label: 동일 기간 공공조달 순증 차이
    inputs: [pps_monthly]
    how: >-
      2025년과 2026년 각각 2~9월의 납품요구 순증 수량·금액을 합산해 차이를 계산한다.
      시행일이 포함된 2026년 1월은 전환월로 분리하고 불완결 월은 제외한다.
    used_by: []
    note: "기존 탐색에서 선택한 기간이며 사전 등록이 아님. 납품·설치·접근성 인증 수량과 다르고 인과효과를 식별하지 못함"

  - id: post_policy_outcomes
    kind: dataset
    status: missing
    label: 시행 후 비교 가능한 이용자 연간 통계
    note: "기존 확보 자료에는 2026 조사연도 값이 없음. 현재 공표 여부·측정 일관성을 재확인해야 하며, 발표연도가 2026인 2025 조사값으로 대체하지 않음"
  - id: device_history
    kind: dataset
    status: missing
    label: 기기별 기능 도입·교체·철거 이력
    note: "현재 현황만으로 과거 기능을 복원할 수 없음. 삭제·철거 기기를 포함한 이력 또는 반복 스냅샷 필요. 보류 중인 NIA 위치 API 수집은 이번 범위에 포함하지 않음"
  - id: treatment_comparison
    kind: dataset
    status: missing
    label: 대상별 실제 적용일과 비교집단 모집단
    note: "적용·유예·최초 도입·기업 규모·영업 및 관측 여부·지원사업 노출을 검증한 자료 미확보. 비관측을 0으로 채우거나 취약계층을 독립 대조군으로 사용하지 않음"
