[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "policy-effect-analytics-agent"
version = "0.1.0"
description = "Agentic AI x Data: define public problems, estimate policy effects, automate reporting (NIPA OpenUp track 3)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "가짜연구소 Causal Inference Team" }]
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "statsmodels>=0.14",
  "pyfixest>=0.60",
  "scipy>=1.11",
  "streamlit>=1.35",
  "requests>=2.31",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2", "langchain-core>=0.3"]
causal = ["dowhy>=0.12"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[project.urls]
Repository = "https://github.com/CausalInferenceLab/policy-effect-analytics-agent"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
