limitations:
- 대상은 부산·서울·경기·전주·군산·부안과 부산 안전속도 5030이다. 전국 정책 도입 패널을 완성한 자료가 아니다.
- candidate는 공식 개시 근거에 따른 조사 후보이다. 확정 미처치 또는 분석 대조군 승인·평행추세 충족을 뜻하지 않는다. 모든 analysis_approved는 false이다.
- 부산 2018-07과 경기 2019-09의 일자 및 군산·부안 2020년의 월일은 확인하지 못했다. 발행일·조례일·자격 소급일·실제 지급일로 대체하지 않았다.
- 전주의 행정답변은 2020년부터 시행이라고 설명하지만 “최초”라는 단어를 쓰지 않는다. 사업 안내와 결합한 후보 근거이며 모든 선행지원 부재를 증명하지 않는다. 군산은 회의록에서 담당자가 처음 시행이라고
  명시한다.
- 부산 5030은 2019-11-11 도심 전역 시행, 2020-05-12 본격 단속으로 구분했다. 2019년 전체 노출로 처리하지 않으며 면허 반납 정책의 고유 효과가 통계적으로 분리되었다고 주장하지
  않는다. 연도 고정효과나 군집 표준오차가 부산 고유 동시정책을 제거하는 것은 아니다.
- 2019년 고령운전자 교육제도의 공통 성분을 연도 효과로 조정해도 지역별 연령 구성·갱신 대상 비중 등에 따른 차등 영향까지 전부 제거됐다고 볼 수 없다. 이번 조사에서는 교육정책 출처·노출을 새로
  검증하지 않았다.
- 효과 추정, 사전 추세 검정, 분석표본 승인, 전국정책 완성은 수행하지 않았다. 사고·인구 원본 자료를 수정하지 않았다.
