# 분석 계획서 (사전 등록) — 데이터를 열어보기 "전에" 작성하고 먼저 PR 하세요.
# 스키마: core/schema/plan.py  (정의되지 않은 필드는 검증 오류가 납니다)
# 작성 요령: docs/strategy/plan-guide.md  |  완성 예시: cases/t3-land-permit-2025/plan.yaml
#
# 정책 근거
#  - 행정안전부 보도자료(2026.8.24) "복잡한 표·그림 대신 고품질 텍스트로 행안부, AI 친화적 보고서 전면 도입"
#    https://www.mois.go.kr/frt/bbs/type010/commonSelectBoardArticle.do?bbsId=BBSMSTR_000000000008&nttId=128940
#    · 2026.3월 시범운영 시작: 서술형 작성 권장, "표 안의 표" 같은 복잡한 양식 지양, 보도자료를 마크다운으로 함께 제공
#    · 2026.8.24 가이드라인 간소화 + 전면 실시, 실·국장 보고서까지 확대
#  - 국가인공지능전략위원회(2026.3.5 발표): 분과 회의·토론 결과를 마크다운(.md)으로 작성해 누리집 공개
#    https://kitpa.org/news/1175 (한국정보기술신문, 2026.3.8)
#
# 측정 범위: 두 단계로 본다.
#  1단계(1차 지표) 보도자료 형식이 실제로 바뀌었는가 — 바뀌지 않았다면 뒤의 효과도 생길 수 없다.
#  2단계(2차 지표) 그 결과 기계가 더 잘 읽게 되었는가(기계 판독 표 손상률).
# 보도자료가 밝힌 나머지 기대 효과(직원 작성 시간 단축, AI 요약 정확도)는 기관 간 비교 가능한 공개 자료가 없어
# 추정하지 않고 discussion.md 에 한계와 다음 과제로 적는다.
#
# 사전 등록(0d173a9) 뒤 바꾼 것 — 데이터를 열기 전, 수집 경로를 확인하다가 바꿨다. 자세한 이유는 discussion.md
#  - 언론 확산 지표 2개(log_articles_per_release, hours_to_first_article)와 '언론 관심 변화 없음' 가정을 뺐다:
#    빅카인즈 OPEN API 는 신청·승인이 필요하고 승인을 받지 못했다(계획서에 미리 적은 규칙대로 뺌)
#  - 데이터 출처: 공공데이터포털 정책브리핑 보도자료 API 가 폐기되어 정책브리핑 누리집 목록·본문·첨부(HWPX·PDF)로 바꿨다
#  - 표·문장 지표를 본문 HTML 대신 첨부 HWPX(XML)에서 센다. 본문이 문서 뷰어 이미지로만 나와 HTML 표가 없다
#  - 형식 지표는 기관·월마다 고정 시드로 5건을 뽑아 계산한다(전수는 약 9만 건). 월별 건수(releases)는 전수
#  - 첫 처치 월을 2026-03 → 2026-04 로 옮겼다: 시범운영 가이드라인이 2026.3.24 공개·배포되어(디지털데일리
#    2026.3.24) 3월은 마지막 일주일만 처치된다. 3월은 rel -1(선반영 점검)로 두고 기준 시점을 2026-02(ref -2)로 바꿨다
# 데이터를 받은 뒤 바꾼 것 (make flow 가 이 지표에서 멈춘 뒤. 원인을 찾으려 지표별로 돌리며 다른 지표의
# 추정치도 보았으나, 그 네 지표의 정의·창·기준 시점·반박 검정은 하나도 바꾸지 않았다)
#  - 마크다운 첨부 제공 비율(md_attach_share)을 결과 지표에서 뺐다: 수집한 5,756건 어디에도 .md 첨부가 없어
#    1,155칸 모두 0이고 표준오차가 0이 되어 추정이 멈춘다. 효과 크기가 아니라 변동이 없다는 이유로 뺐다

case_id: gyeom-yee-public-markdown
title: "행정안전부 'AI 친화적 보고서' 도입(2026.3 시범)이 보도자료 형식과 기계 판독에 미친 효과"
question: >
  행정안전부가 2026년 3월 'AI 친화적 보고서' 작성 방식(서술형 작성, 복잡한 표 지양, 마크다운 병행 제공)을
  시범 도입한 뒤, 같은 방식을 도입하지 않은 다른 중앙행정기관과 비교해 행안부 보도자료의
  서술형 문장 비율이 높아지고 표 사용이 줄었는가? 그리고 그 결과 공개 파서로 텍스트화할 때의 표 손상이 줄었는가?
synthetic_data: false

# 한 행 = 기관 x 월. releases 는 그 달 정책브리핑의 해당 기관 보도자료 전체, 형식 지표는 그중 고정 시드 표본 5건(5건 미만이면 전부).
unit: {name: 중앙행정기관, id_col: org_id}
time: {col: month_idx, freq: month, start: 0, end: 32}   # 0 = 2024-01, 26 = 2026-03, 32 = 2026-09 (마지막 완결 월)

treatment:
  definition: >
    행정안전부. 시범운영 가이드라인 공개·부내 배포 2026-03-24, 첫 처치 월 = 2026-04 (month_idx 27, 첫 완전 처치 월).
    2026-03(month_idx 26)은 일주일만 처치되어 rel -1 로 두고 선반영 점검에 쓴다.
    2026-08-24 전면 실시(month_idx 31)는 처치 강도가 커진 시점으로 보고 이벤트 스터디의 사후 계수(+4, +5)로 따로 읽는다.
  group_col: treated
  treat_time: 27
control:
  definition: >
    정책브리핑(korea.kr)에 보도자료를 올리는 다른 중앙행정기관(부·처·청) 중 2024-01~2026-09 모든 달에
    보도자료가 1건 이상 있는 기관. 다음은 뺀다:
    (1) 국가인공지능전략위원회 — 같은 달 마크다운 전환을 발표해 처치 기관에 가깝다
    (2) 행안부 소속 청(경찰청·소방청) — 행안부 가이드라인이 번질 수 있다
    (3) 분석 기간 중 조직 개편으로 명칭·기능이 바뀌어 같은 단위로 이을 수 없는 기관
    (4) 기간 중 'AI 친화 문서'·'마크다운' 작성 지침을 발표한 것이 확인된 기관
  rationale: >
    중앙행정기관은 같은 정책브리핑 게시 체계와 한글(HWP) 기반 보도자료 양식, 같은 언론 환경을 공유한다.
    정부 전체에 걸친 AI 활용 기조처럼 모든 기관이 함께 받는 충격은 대조군이 흡수한다.
    행안부만 2026.3월에 문서 작성 지침을 바꿨으므로, 지침이 없었다면 행안부 보도자료 형식이 따랐을 추세를
    다른 기관의 추세가 대신 보여 준다.

outcomes:
  - name: 서술형 문장 비율
    col: narrative_share
    definition: >
      표본 보도자료 첨부 HWPX 본문(표 밖 최상위 문단)의 문장·항목 중 '~다.'로 끝나는 서술문의 비율(표본 합산).
      분모 = 문단(항목 기호로 시작하는 줄은 HWPX 에서 각자 한 문단) 안을 '다.' 뒤에서 나눈 문장·항목 중
      공백 빼고 5자 이상인 것. 표 안의 글자는 뺀다. HWPX 가 없는 보도자료는 뺀다.
    unit: "비율(0~1)"
    primary: true
    expected_direction: increase
  - name: 보도자료 1건당 표 수
    col: tables_per_release
    definition: "표본 보도자료 HWPX 의 최상위 표(hp:tbl) 개수 합 ÷ HWPX 가 있는 표본 보도자료 수 (머리 상자·담당자 표 포함)"
    unit: "개/건"
    expected_direction: decrease
  - name: 중첩 표 포함 보도자료 비율
    col: nested_table_share
    definition: "HWPX 표 안에 다시 표가 있는 표본 보도자료 수 ÷ HWPX 가 있는 표본 보도자료 수 (가이드라인의 '표 안의 표')"
    unit: "비율(0~1)"
    expected_direction: decrease
  # 마크다운 첨부 제공 비율(md_attach_share)은 수집 결과 모든 기관·월에서 0이라 추정할 수 없어 뺐다.
  # 패널에는 남겨 두고 discussion.md 에 기술 통계로 적는다.
  # 2단계: 기계 판독 — 보도자료가 밝힌 "AI가 보고서를 인식하는 오류 감소"의 대리 지표
  - name: 기계 판독 표 손상률
    col: parse_table_loss
    definition: >
      표본 보도자료의 첨부 PDF 를 pdfplumber 0.11.4 의 extract_tables 로 읽었을 때, 같은 보도자료 HWPX 의
      가장 안쪽 표 셀(빈 셀 제외) 중 PDF 추출 결과에 같은 글자(공백 무시)의 셀로 나오지 않은 셀의 비율(표본 합산).
      표가 없는 보도자료는 손상 셀 0, 분모 0으로 넣어 표를 줄인 효과도 반영한다(표 셀이 0인 달은 결측).
      HWPX 와 PDF 가 모두 있는 보도자료만 쓴다
    unit: "비율(0~1)"
    expected_direction: decrease

estimator:
  method: event_study
  cluster_col: org_id
  ref_period: -2          # 2026-02 (2026-03 은 일부만 처치되어 기준에서 뺀다)
  window: [-12, 5]        # 2025-04 ~ 2026-09. -12 이전은 양끝 binning
  alpha: 0.05

assumptions:
  - name: 평행추세
    description: "지침이 없었다면 행안부와 다른 기관의 서술형 비율·표 사용 추세는 같았을 것"
    check: pretrend_test
  - name: 미리 반응하지 않음
    description: "가이드라인 공개(2026.3.24) 전에 행안부가 미리 형식을 바꾸지 않았을 것. rel -1(2026-03) 계수와 가짜 시작일 검정으로 확인"
    check: placebo_time
  - name: 대조군 오염 없음
    description: >
      국가AI전략위원회 발표(2026.3.5)와 행안부 전면 실시(2026.8.24) 뒤 다른 부처가 비슷한 지침을 따랐다면
      대조군도 처치를 받아 효과가 작게 추정된다. 기관별 누리집·보도자료에서 'AI 친화'·'마크다운' 지침 발표를 확인해
      해당 기관을 빼거나, 빼기 어려우면 한계로 기록한다
    check: manual
  - name: 동시 정책 없음
    description: >
      같은 시기 행안부에만 적용된 다른 문서 양식 변경(보도자료 서식 개편, 정책브리핑 게시 방식 변경, 담당 부서 교체)이 없을 것.
      정책브리핑 게시 방식이 바뀌었다면 모든 기관에 같이 나타나므로 대조군이 흡수한다
    check: manual
  - name: 측정 일관성
    description: "기관이 올린 첨부 HWPX·PDF 가 기간 내내 같은 방식(같은 한글 프로그램 계열)으로 만들어진다. HWP 만 있는 비율을 월별로 기록해 확인한다"
    check: manual

refutations:
  - kind: placebo_time
    params: {shift: 6}          # 가짜 시작일 2025-10 — 효과가 없어야 통과
  - kind: placebo_outcome
    params: {col: releases}     # 월별 보도자료 건수 — 문서 형식 지침이 건수까지 바꿀 이유는 없다.
                                # 공통 실행기(core/pipeline.py)가 아직 placebo_outcome 을 실행하지 않으므로
                                # releases 를 결과로 한 번 더 돌려 discussion.md 에 함께 보고한다.
  - kind: drop_unit
    params: {unit: 과학기술정보통신부}   # AI 정책 주무부처라 자체적으로 비슷한 변화를 겪었을 수 있다. 빼고 다시 추정해 비교.
                                      # drop_unit 도 수동 실행 후 discussion.md 에 보고한다.

abstention:
  - when: pretrend_rejected
    verdict: not_identified
  - when: few_treated_clusters
    verdict: conditional
    note: "처치 기관이 행안부 1곳 → 무작위화 추론. 대조 기관 수가 곧 p값의 해상도(최소 1/(N+1))"
  - when: placebo_significant
    verdict: conditional
  - when: ci_crosses_zero
    verdict: conditional
    note: "효과 없음이 아니라 '판별 불가'로 보고"
  - when: few_clusters
    verdict: conditional

thresholds: {pretrend_alpha: 0.10, min_clusters: 20, min_pre_periods: 3}

data_sources:
  - name: "대한민국 정책브리핑 보도자료 (목록·본문·첨부 HWPX·PDF)"
    provider: "문화체육관광부 국정홍보 (korea.kr)"
    url: "https://www.korea.kr/briefing/pressReleaseList.do"
    license: KOGL-1
    notes: >
      보도자료 본문에 공공누리 제1유형 표시가 있다. robots.txt 가 수집을 허용한다.
      공공데이터포털 API(15095295)는 2026.11 확인 시 '서비스가 없거나 폐기됨'(코드 12)이라 쓰지 않는다.
      원문·첨부는 저장하지 않고 보도자료별 지표만 data/raw 에 캐시한다(커밋하지 않음). fetch.py 로 각자 받는다.
  - name: "행정안전부 보도자료 게시판 (첨부파일 형식 확인용)"
    provider: "행정안전부"
    url: "https://www.mois.go.kr/frt/bbs/type010/commonSelectBoardList.do?bbsId=BBSMSTR_000000000008"
    license: KOGL-1
    notes: "정책브리핑에 마크다운 첨부가 없을 때 행안부 누리집 첨부 목록으로 마크다운 제공 여부를 확인한다(md_attach_share 계산에는 쓰지 않고 discussion.md 에 기록)"
