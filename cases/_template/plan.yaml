# 분석 계획서 (사전 등록) — 데이터를 열어보기 "전에" 작성하고 먼저 PR 하세요.
# 스키마: core/schema/plan.py  (정의되지 않은 필드는 검증 오류가 납니다)
# 작성 요령: docs/strategy/plan-guide.md  |  완성 예시: cases/t3-land-permit-2025/plan.yaml

case_id: gildong-topic              # 폴더 이름과 똑같이 (<내ID>-<주제>, 소문자-하이픈)
title: "정책 효과 분석 제목"
question: >
  X 정책이 도입된 지역/집단에서, 도입되지 않은 곳 대비 Y가 변했는가?
synthetic_data: false                # 합성 데이터면 true (라이선스도 synthetic)

# 분석 단위와 시간축: 한 행 = 단위 x 시점
unit: {name: 시군구, id_col: region_id}
time: {col: year, freq: year, start: 2015, end: 2019}   # freq: year|quarter|month|week|day

# 처치 / 대조
treatment:
  definition: "정책 X가 T년에 시행된 지역"
  group_col: treated                 # 처치집단 여부(0/1) 컬럼
  treat_time: 2017                   # 동시 도입일 때
  # first_treat_col: first_treat     # 시차 도입이면 treat_time 대신 사용
control:
  definition: "분석 기간 중 정책 X가 시행되지 않은 지역"
  rationale: "왜 이 집단이 '정책이 없었다면'의 대리가 되는가"

# 결과 지표 (primary 1개)
outcomes:
  - name: 주요 결과 지표
    col: outcome
    definition: "분자/분모/기간까지 조작적으로 정의"
    unit: "건/천명"
    primary: true
    expected_direction: unknown      # increase | decrease | unknown

# 추정 방법: did | event_study | its
estimator:
  method: event_study
  cluster_col: region_id
  ref_period: -1
  window: [-4, 3]
  alpha: 0.05

# 식별 가정과 점검 방법 (check: pretrend_test | placebo_time | manual | none)
assumptions:
  - name: 평행추세
    description: "정책이 없었다면 두 집단의 추세는 같았을 것"
    check: pretrend_test
  - name: 동시 정책 없음
    description: "같은 시점에 결과에 영향을 준 다른 정책이 없음"
    check: manual

# 반박 검정 (kind: placebo_time | placebo_outcome | drop_unit)
refutations:
  - kind: placebo_time
    params: {shift: 2}

# 결론 보류 규칙 — 해당하면 효과를 '주장하지 않는다'
# when: pretrend_rejected | few_clusters | staggered_adoption | placebo_significant | ci_crosses_zero | short_pre_period
abstention:
  - when: pretrend_rejected
    verdict: not_identified
  - when: staggered_adoption
    verdict: not_identified
  - when: ci_crosses_zero
    verdict: conditional
    note: "효과 없음이 아니라 '판별 불가'로 보고"

thresholds: {pretrend_alpha: 0.10, min_clusters: 20, min_pre_periods: 3}

# 데이터 출처 — license 필수 (KOGL-1~4 | CC-BY-4.0 | CC0 | synthetic | other)
data_sources:
  - name: "데이터셋 이름"
    provider: "기관명 (예: 통계청 KOSIS)"
    url: "https://..."
    license: KOGL-1
    adapter: kosis                   # core.adapters 의 어댑터 이름 (없으면 삭제)
