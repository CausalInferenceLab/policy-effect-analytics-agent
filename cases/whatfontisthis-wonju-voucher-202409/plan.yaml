# 2026-10-18 설계 검토용 초안. 비교도시와 실제 자료는 아직 미확정이에요.
# 효과 계산 전에 README의 시작 조건과 최종 명단을 확인하고 커밋해야 해요.
# 형식 검사를 통과해도 실제 자료 확보나 분석 승인을 뜻하지 않아요.
case_id: whatfontisthis-wonju-voucher-202409
title: "원주시 모바일 상품권 할인 상향 기간의 단기 결제 변화"
question: >
  2024년 9월 2일 원주시 모바일 원주사랑상품권 구매 할인이 7%에서 10%로
  상향된 뒤 9월 29일까지, 혜택 조건이 안정적인 비교도시와 비교해
  원주의 주간 모바일 상품권 결제금액이 어떻게 달라졌는가?
synthetic_data: false # 실제 자료를 사용할 계획이에요. 아직 자료를 받은 것은 아니에요.

# 한 행은 도시 하나의 일주일 기록이에요. 월요일부터 일요일까지 묶어요.
unit:
  name: "2024년 기준 일반시"
  id_col: region_code
time:
  col: week_idx
  freq: week
  start: 0
  end: 16
  datetime_col: week_start
# 0주차=2024-06-03, 10주차=08-12, 13주차=09-02, 16주차=09-23.
# 기본 표에는 0~10과 13~16만 남겨요. 안내 전후 11·12는 빼요.
# 빠진 주 때문에 번호를 다시 매기지 않아요. 09-30 이후는 주 분석에 넣지 않아요.

treatment:
  definition: >
    원주시 모바일 원주사랑상품권의 구매 할인이 7%에서 10%로 바뀐 사례다.
    원주시공고 제2024-2250의 시행일은 2024-09-02 10:00이다.
    2024년 9월 동행축제와 추석을 위한 한시 혜택이다.
    원주의 모든 관측 주에 treated=1을 부여하며, 변경 후는 week_idx 13~16이다.
    기본 표를 16주차에서 끝내므로 한시 정책을 영구적인 혜택으로 계산하지 않는다.
    첫 주의 오전 10시 이전 혼합은 첫 사후 주 제외 분석으로 확인한다.
    정확한 판매 종료·조기 소진·발행액·구매한도·동시 행사 이력은 추가 확인한다.
    공고기간의 마지막 날을 실제 판매 종료 시각으로 간주하지 않는다.
    근거: https://www.wonju.go.kr/www/selectBbsNttView.do?bbsNo=140&key=216&nttNo=444171
  group_col: treated
  treat_time: 13

control:
  definition: >
    최종 명단 미확정. 2024년 기준 일반시 중 원주 외 적격 도시 5곳 이상을 찾는다.
    춘천·강릉·충주·제천은 조사 후보일 뿐 대조군으로 확인한 곳이 아니다.
    기준 인구가 원주의 0.5~2배인 일반시를 먼저 조사하고 인구 출처와 기준일을 남긴다.
    동일한 모바일 범위와 제공기관 집계 정의로 0~10 및 13~16주가 모두 관측돼야 한다.
    할인율·구매한도·발행 지원·가맹점 제한·자료 제공 방식의 주요 변경이 없어야 한다.
    추석·동행축제 추가 혜택과 인접 지역 소비 이동 가능성을 확인한다.
    최종 적격 도시 목록과 제외 이유를 결과 계산 전에 확정하고 커밋한다.
    적격 비교도시 5곳 미만이거나 자료가 부족하면 이 설계의 실행을 보류한다.
  rationale: >
    비슷한 규모의 도시가 같은 기간에 겪은 공통 소비 변화를 비교하려는 계획이다.
    변경 전 추세·명절 수요·행사·발행 조건이 지역별로 다를 수 있어 적합성을 확인해야 한다.
    도시가 같은 방향으로 움직일 근거가 부족하면 정책 효과의 인과해석을 보류한다.
    최종 명단과 자료 범위가 미확정이므로 현재는 설계 검토용 초안이다.

outcomes:
  - name: "주간 모바일 상품권 결제금액의 로그 변환"
    col: log_payment_amount
    definition: >
      같은 범위의 모바일 결제금액을 월요일부터 일요일까지 원 단위로 합산한 뒤
      log(1+payment_amount)를 계산한다. 금액이 비음수이고 환불·취소 기준이
      모든 지역과 기간에 일관될 때만 사용한다. 결측은 0으로 바꾸지 않는다.
      원 단위 결제금액과 그래프도 함께 보고하며 전체 소상공인 매출로 해석하지 않는다.
    unit: "log(1+원)"
    primary: true
    expected_direction: unknown
  - name: "주간 모바일 상품권 결제횟수"
    col: payment_count
    definition: >
      주 지표와 같은 지역·주·모바일 범위의 결제횟수 합계다.
      누락을 0으로 채우지 않으며 금액 지표와 결과가 달라도 주 지표를 바꾸지 않는다.
    unit: "건/주"
    primary: false
    expected_direction: unknown

estimator:
  method: did
  cluster_col: region_code
  covariates: [] # 판매액·발행액처럼 정책의 영향을 받는 값을 자동으로 보정하지 않아요.
  alpha: 0.05

assumptions:
  - name: "과거 자료와 모바일 범위 확인"
    description: >
      아직 실제 API 응답을 확인하지 않았다. 2024년 6~9월 일별 또는 주별 자료,
      모바일 유형, 거래일·정산일·환불과 제공기관 중복 범위를 확인한 뒤 실행한다.
      원주와 비교도시의 동일한 15개 주, 중복 없음, 결과변수 결측 없음을 점검한다.
      누락을 0이나 보간으로 채우지 않는다. 월별 자료만 있으면 주간 분석을 보류한다.
    check: manual
  - name: "시점 번호와 한시 정책 범위"
    description: >
      2024-06-03이 0, 09-02가 13, 09-23이 16인지 공용 시간 함수로 확인한다.
      기본 표에서 11·12를 제거하고 17 이후를 포함하지 않는다.
      기본 비교는 사전 11주·사후 4주이며 원주와 모든 비교도시에 같은 주가 있어야 한다.
      현재 did 경로는 사전 기간 수를 자동 검사하지 않아 수집·품질 점검에서 직접 확인한다.
    check: manual
  - name: "변경 전의 비슷한 움직임"
    description: >
      사전 11주의 수준·추세와 주별 그래프를 별도로 확인한다.
      did 경로는 사전추세 자동 검정을 실행하지 않으므로 이 선언만으로 통과 처리하지 않는다.
      추세가 명백히 다르거나 비교 근거가 부족하면 인과해석을 보류한다.
      차이가 발견되지 않았다고 평행추세가 증명됐다고 말하지 않는다.
    check: manual
  - name: "명절과 함께 바뀐 조건"
    description: >
      원주와 비교도시의 동행축제·추석 지원·발행액·구매한도·사용처 변화를 확인한다.
      할인과 함께 바뀐 조건을 분리할 근거가 부족하면 할인율 단독 효과라고 설명하지 않는다.
      상품권 결제 증가를 소상공인 전체 매출이나 순소비 증가로 환산하지 않는다.
    check: manual
  - name: "공고 선반응과 첫 주"
    description: >
      08-19~09-01은 기본 비교에서 빼고 따로 보여준다.
      이 기간을 포함한 결과와 첫 사후 주를 뺀 결과도 별도로 비교한다.
      기본 계획과 다른 추가 실행의 기간·이유·결과를 모두 남긴다.
    check: manual
  - name: "최종 비교도시와 소비 이동"
    description: >
      비교도시 5곳 이상과 선정·제외 이유를 확정하기 전 실행하지 않는다.
      인접 지역의 소비 이동을 확인하고 결과를 보고 유리한 도시만 남기지 않는다.
      비교도시를 하나씩 빼는 점검은 현재 공용 흐름에서 자동 실행되지 않아 별도로 수행한다.
      도시 제외나 첫 주 제외로 결과 부호가 바뀌면 강한 결론을 보류한다.
    check: manual
  - name: "원주 한 곳을 비교하는 한계"
    description: >
      실제 혜택 변경 도시는 원주 한 곳이다. 주별 기록이 많아도 독립된 정책 사례가 늘지 않는다.
      공용 코드의 소수 처치 무작위화 추론 적용 조건과 후보 지역의 교환가능성을 확인한다.
      근거가 부족하면 계산값은 탐색적으로만 공개하고 인과효과 판단을 보류한다.
      신뢰구간과 p값이 출력됐다는 이유만으로 타당성이 확인됐다고 쓰지 않는다.
    check: manual

# 가짜 시작은 13-6=7주차(2024-07-22). 사전 표 0~10에서 7주 전·4주 후를 비교해요.
refutations:
  - kind: placebo_time
    params: {shift: 6}
# 비교도시 하나씩 제외, 첫 주 제외, 완충 2주 포함은 README에 적은 별도 점검이에요.

abstention:
  - when: pretrend_rejected
    verdict: not_identified
    note: "해당 진단을 별도 실행해 얻은 경우 적용한다. did 자체는 자동 실행하지 않는다."
  - when: staggered_adoption
    verdict: not_identified
    note: "같은 시점의 변경을 비교하는 설계와 다르면 인과 판정을 보류한다."
  - when: placebo_significant
    verdict: conditional
    note: "가짜 시점에도 차이가 나면 실제 변경의 효과라는 설명을 재검토한다."
  - when: ci_crosses_zero
    verdict: conditional
    note: "효과 없음 대신 효과 방향이 불확실하다고 설명한다."
  - when: few_clusters
    verdict: conditional
    note: "도시 수 경고를 없애기 위해 기준을 낮추지 않는다."
  - when: few_treated_clusters
    verdict: conditional
    note: "원주 한 곳의 사례이며 무작위화 추론의 전제가 맞는지 별도로 확인한다."
  - when: short_pre_period
    verdict: conditional
    note: "did 경로의 자동 검사로 가정하지 않고 사전 11주를 수동 점검한다."

thresholds:
  pretrend_alpha: 0.10
  min_clusters: 20 # 비교도시 최소 5곳이라는 수동 시작 조건과 다른 경고 기준이에요.
  min_pre_periods: 11 # 기본 비교 사전 기간이에요. 가짜 시점 비교는 7주로 한계를 적어요.

data_sources:
  - name: "한국조폐공사 지역사랑상품권 결제정보"
    provider: "한국조폐공사 / 공공데이터포털"
    url: "https://www.data.go.kr/data/15108292/openapi.do"
    license: other
    path: data/panel.csv
    notes: >
      소개 페이지의 이용허락범위는 제한 없음이다. 특정 공공누리 유형으로 추정하지 않는다.
      지역별 결제금액·건수 소개는 확인했으나 2024년 기간과 모바일 분리 조회는 미확인이다.
      실제 응답과 원본 필드명·단위를 확인한 뒤 표준 칼럼에 연결한다.
      실제 수집기와 어댑터는 아직 구현하지 않았다. data/panel.csv도 아직 없다.
      원자료, 인증키와 분석용 자료는 커밋하지 않는다.
  - name: "한국조폐공사 지역사랑상품권 지자체별 판매정책정보"
    provider: "한국조폐공사 / 공공데이터포털"
    url: "https://www.data.go.kr/data/15125217/openapi.do"
    license: other
    path: data/policy_history.csv
    notes: >
      소개 페이지의 이용허락범위는 제한 없음이다. 과거 정책 이력 제공은 미확인이다.
      할인율·적용기간·구매한도·지역·유형을 확인해 공식 공고와 대조한다.
      정책 이력을 결제 표와 직접 합산하지 않고 지역·기간·유형 기준으로 연결한다.
      동시 행사·발행액·공식 지역코드와 인구 원표의 출처는 실제 확보 후 추가한다.
