# 2026-10-25 개정(v2). 주 단위 설계(v1)는 월 단위로 바꿨어요. 이유는 README 1·2장과 discussion.md에 적었어요.
# v1은 커밋 7e8c6b8에 남아 있어요. 비교 지역 선정 규칙은 fetch.py의 R1~R3이며 결과 값을 보지 않고 정책·자료 품질만으로 골라요.
# 단, 이 개정은 월별 합계를 한 번 훑어본 뒤에 썼어요. 사전 등록 원칙에서 벗어난 점이므로 discussion.md에 밝혀요.
case_id: whatfontisthis-wonju-voucher-202409
title: "원주시 모바일 상품권 할인 상향 한 달(2024년 9월)의 결제 변화"
question: >
  2024년 9월 2일 원주시 모바일 원주사랑상품권 구매 할인이 7%에서 10%로 상향된 달(9월),
  6~9월 내내 할인율과 구매한도가 그대로였던 한국조폐공사 운영 시군과 비교해
  원주의 월간 모바일 상품권 결제금액이 어떻게 달라졌는가?
synthetic_data: false

# 한 행은 시군 하나의 한 달 기록이에요. 공공데이터 결제정보가 월 단위로만 제공돼요.
unit:
  name: "한국조폐공사 운영 시군(원주 + 규칙을 통과한 비교 7곳)"
  id_col: region_code
time:
  col: month_idx
  freq: month
  start: 0
  end: 3
  datetime_col: month_start
# 0=2024-06, 1=07, 2=08, 3=09. 정책이 매달 바뀐 1~5월은 분석 표에서 뺐어요(panel_extended.csv에는 있음).
# 10월 이후는 7%로 되돌아간 뒤라 처치 기간에 넣지 않아요.

treatment:
  definition: >
    원주시 모바일 원주사랑상품권의 구매 할인이 7%에서 10%로 바뀐 달이다.
    원주시공고 제2024-2250의 시행일은 2024-09-02 10:00이다. 판매정책정보 API에는 2024-09-03부터
    10%/월 30만 원 기록이 보이고 2024-10-03부터 다시 7%로 돌아간다(월 구매한도는 30만 원 그대로).
    2024년 9월 동행축제와 추석을 위한 한시 혜택이다.
    원주의 month_idx 3(2024-09)에 treated 사후를 부여한다. 9월 1일은 혜택 전이고 시행일 오전 10시 전
    기록도 섞이지만 월 자료라 분리할 수 없다. 이것이 월 단위 설계의 근본 한계다.
    2024년 1~5월 원주는 할인율이 6%, 8%, 10%, 8%로 달마다 바뀌어서 안정적인 변경 전 기간은 6~8월 3개월뿐이다.
    근거: https://www.wonju.go.kr/www/selectBbsNttView.do?bbsNo=140&key=216&nttNo=444171
  group_col: treated
  treat_time: 3

control:
  definition: >
    fetch.py가 한국조폐공사 운영 81개 지역 중 세 규칙을 모두 통과한 곳만 쓴다.
    R1 2024-06-01~09-30에 할인율·월 구매한도가 한 가지뿐이다.
    R2 2024-01~10 모든 달에 모바일 결제금액이 있고 매달 1억 원 이상이다.
    R3 2024-01~10 인접한 달 사이 로그 변화가 0.5 이하다.
    통과 지역은 시흥시·보령시·서천군·태안군·문경시·합천군·남원시 7곳이다.
    탈락 지역과 이유는 data/selection.csv에 남는다. 규칙은 결과 값을 보지 않고 정책·자료 품질만 본다.
    같은 제공기관(조폐공사) 집계라 자료 정의가 같다. 지역 규모는 원주의 0.5~2배로 맞추지 못했다.
    7곳 중 인구가 원주와 비슷한 곳은 시흥(더 큼)뿐이고 나머지는 훨씬 작은 시·군이다.
  rationale: >
    같은 시기에 정책이 바뀌지 않은 지역은 9월의 공통 변화(추석, 동행축제 홍보, 계절)를 보여 준다.
    조폐공사 운영 81개 지역 중 R1 탈락 52곳의 40곳은 9월에 6~8월에 없던 할인율·구매한도를 도입했다(한시 혜택이 전국에서 겹쳤다).
    그래서 정책이 안정적이었던 곳은 7곳뿐이다. 7곳은 규모와 지역 특성이 원주와 다르다는 한계를 안고 있다.

outcomes:
  - name: "월간 모바일 상품권 결제금액의 로그 변환"
    col: log_mbl_use_amt
    definition: >
      결제정보 API의 mbl_use_amt(모바일 결제금액)를 지역·월별로 성별·연령대·읍면동 행을 합산한 뒤 log(1+금액)을 계산한다.
      결측은 0으로 바꾸지 않는다. 원 단위 금액과 그래프도 함께 보고하며 전체 소상공인 매출로 해석하지 않는다.
    unit: "log(1+원)"
    primary: true
    expected_direction: unknown
  - name: "월간 모바일 이용자 수의 로그 변환"
    col: log_mbl_user_cnt
    definition: >
      mbl_user_cnt(모바일 이용자 수)를 지역·월별로 모든 행에서 합한 값의 log(1+값)이다.
      한 사람이 여러 읍면동·연령 칸에 중복 집계될 수 있어 사람 수가 아니라 칸의 합이다.
      금액과 결과가 달라도 주 지표를 바꾸지 않는다.
    unit: "log(1+명)"
    primary: false
    expected_direction: unknown

estimator:
  method: did
  cluster_col: region_code
  covariates: [] # 판매액·발행액처럼 정책의 영향을 받는 값을 자동으로 보정하지 않아요.
  alpha: 0.05

assumptions:
  - name: "월별 자료의 범위와 정의"
    description: >
      결제정보 API는 월 단위 합계만 준다. 모바일 금액은 승인일인지 정산일인지, 환불이 어떻게 반영되는지 문서에 없다.
      조폐공사가 운영하는 지역만 포함되며 다른 운영대행사(코나아이 등) 지역은 판매정책 API에 없어 비교하지 않았다.
      원주의 모바일 금액이 전체 모바일 발행 규모와 맞는지 따로 확인하지 못했다.
    check: manual
  - name: "시점 번호와 한시 정책 범위"
    description: >
      month_idx 0=2024-06, 3=2024-09. 사전 3개월이 전부라 사전추세 검정과 가짜 시점 비교의 힘이 매우 약하다.
      panel_extended.csv의 1~5월은 원주 정책이 달마다 바뀐 기간이라 사전 기간에 넣지 않고 그래프로만 참고한다.
      10월(7%로 복귀)은 사후에 넣지 않고 복귀 효과를 보는 별도 확인으로만 쓴다.
    check: manual
  - name: "변경 전의 비슷한 움직임"
    description: >
      사전 3개월의 원주 대비 비교 지역 평균 차이가 평평한지 별도로 확인한다.
      did 경로는 사전추세 자동 검정을 하지 않거나 힘이 약하므로 이 선언만으로 통과 처리하지 않는다.
      차이가 발견되지 않았다고 평행추세가 증명됐다고 말하지 않는다.
    check: manual
  - name: "명절과 함께 바뀐 조건"
    description: >
      추석(2024-09-17)과 동행축제가 전국에서 겹친다. 비교 7곳은 할인율·구매한도는 그대로였지만
      지자체 자체 홍보나 가맹점 행사는 확인하지 못했다. 할인과 함께 바뀐 조건을 분리할 근거가 부족하면
      할인율 단독 효과라고 설명하지 않는다. 상품권 결제 증가를 소상공인 전체 매출이나 순소비 증가로 환산하지 않는다.
    check: manual
  - name: "구매 시점과 사용 시점"
    description: >
      할인은 구매할 때 적용되고 결제금액은 사용 시점에 잡힌다. 9월 구매분이 10월 이후 사용되면
      9월 결제금액만으로는 효과를 놓칠 수 있다. 한 달짜리 자료라서 구매액과 사용액을 구분하지 못한다.
    check: manual
  - name: "비교 지역의 대표성"
    description: >
      비교 7곳은 규칙을 통과한 곳이라 규모·산업이 원주와 다르다. 로그 차분으로 규모를 줄이지만 같은 방향으로
      움직일 이유가 충분하지는 않다. 한 곳씩 빼도 결과가 바뀌는지 별도로 확인한다.
    check: manual
  - name: "원주 한 곳을 비교하는 한계"
    description: >
      실제 혜택 변경 도시는 원주 한 곳이고 변경 후 관측은 9월 한 달뿐이다. 공용 코드의 소수 처치 무작위화 추론
      적용 조건과 교환가능성을 확인한다. 근거가 부족하면 계산값은 탐색적으로만 공개하고 인과효과 판단을 보류한다.
    check: manual

# 가짜 시작은 3-1=2(2024-08). 사전은 6~7월 2개월뿐이라 힘이 약해요. 더 긴 가짜 시점 확인은 extra_checks.py에서 해요.
refutations:
  - kind: placebo_time
    params: {shift: 1}

abstention:
  - when: pretrend_rejected
    verdict: not_identified
    note: "해당 진단을 별도 실행해 얻은 경우 적용한다. 사전 3개월로는 검정의 힘이 약하다."
  - when: staggered_adoption
    verdict: not_identified
    note: "같은 시점의 변경을 비교하는 설계와 다르면 인과 판정을 보류한다."
  - when: placebo_significant
    verdict: conditional
    note: "가짜 시점에도 차이가 나면 실제 변경의 효과라는 설명을 재검토한다."
  - when: ci_crosses_zero
    verdict: conditional
    note: "효과 없음 대신 효과 방향이 불확실하다고 설명한다."
  - when: few_clusters
    verdict: conditional
    note: "도시 수 경고를 없애기 위해 기준을 낮추지 않는다. 지금은 8곳이다."
  - when: few_treated_clusters
    verdict: conditional
    note: "원주 한 곳의 사례이며 무작위화 추론의 전제가 맞는지 별도로 확인한다."
  - when: short_pre_period
    verdict: conditional
    note: "사전 3개월은 짧다. 자동 검사 결과와 별도로 이 한계를 해석에 적는다."

thresholds:
  pretrend_alpha: 0.10
  min_clusters: 20 # 비교 지역 5곳 이상이라는 수동 시작 조건과 다른 경고 기준이에요.
  min_pre_periods: 3

data_sources:
  - name: "한국조폐공사 지역사랑상품권 결제정보"
    provider: "한국조폐공사 / 공공데이터포털"
    url: "https://www.data.go.kr/data/15108292/openapi.do"
    license: other
    path: data/panel.csv
    notes: >
      소개 페이지의 이용허락범위는 제한 없음이다. 특정 공공누리 유형으로 추정하지 않는다.
      /paymentsV3는 월(crtr_ym) 단위로 지역·성별·연령·읍면동별 결제를 주며 mbl_use_amt, mbl_user_cnt 칸이 있다.
      fetch.py가 2024-01~12를 받아 지역·월로 합산한다. 원자료와 인증키는 커밋하지 않는다.
  - name: "한국조폐공사 지역사랑상품권 지자체별 판매정책정보"
    provider: "한국조폐공사 / 공공데이터포털"
    url: "https://www.data.go.kr/data/15125217/openapi.do"
    license: other
    path: data/policy_history.csv
    notes: >
      소개 페이지의 이용허락범위는 제한 없음이다. /cardMobile은 카드와 모바일을 합친 지역별 일별 할인율과 월 구매한도를
      주며 조폐공사(I0000004) 운영 지역만 있다. 월말 하루는 0%로 기록돼 있어 규칙에서 제외한다.
      결제와 같은 지역·기간 기준으로 연결하며 결제 표에 직접 합산하지 않는다.
  - name: "한국조폐공사 지역사랑상품권 사용처지역코드 참고문서"
    provider: "한국조폐공사 / 공공데이터포털"
    url: "https://www.data.go.kr/data/15108292/openapi.do"
    license: other
    path: region_codes_komsco.csv
    notes: >
      결제정보 안내 페이지의 참고문서 (참고)사용처지역코드.xlsx에서 조폐공사 운영 82개 지역의 코드와 이름만 옮긴 표다.
