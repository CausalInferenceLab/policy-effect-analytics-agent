# overnight_path_sums_config.yaml - 강조 구간의 변화가 인접 구간으로 재배분된 기록인지 같은 노선·시간의 합으로 점검한다.
version: 1
mode: exploratory_after_segment_timeline
locked_year: 2026
selection: results/overnight/persistence_segments/selected_cells.csv
selection_audit: results/overnight/persistence_segments/audit.json
source_scopes: [multiyear, forecast_bus_test]
band: evening
hours: [17, 18, 19]
paths:
  - {key: south_upstream_pair, ars: ['22013', '22011', '22009']}
  - {key: south_downstream_pair, ars: ['22011', '22009', '22007']}
  - {key: south_three_legs, ars: ['22013', '22011', '22009', '22007']}
  - {key: north_upstream_pair, ars: ['22006', '22008', '22010']}
  - {key: north_downstream_pair, ars: ['22008', '22010', '22012']}
  - {key: north_three_legs, ars: ['22006', '22008', '22010', '22012']}
selection_rule: intersect_original_selected_route_hour_cells_across_every_leg_then_require_joint_positive_pre2023_pre2024_coverage
selection_periods: {pre2023: ['2023-05-20', '2023-06-28'], pre2024: ['2024-05-20', '2024-06-28']}
selection_denominator: verified_source_available_weekdays_in_original_pre_periods
minimum_pre_joint_coverage: 0.80
minimum_routes: 3
normalization: per_path_route_hour_sum_mean_on_joint_positive_pre2024_dates; components_use_the_same_joint_dates_and_own_means
missingness: any_leg_missing_blank_zero_negative_or_revisit_invalidates_entire_path_cell_day; no_zero_fill
minimum_coverage: 0.80
minimum_days: 20
maximum_coverage_gap: 0.10
bootstrap: {draws: 2000, seed: 20261029}
comparisons:
  summer2024: [pre2024, post2024]
  summer2025: [pre2025, post2025]
  pre_year_over_year: [pre2024, pre2025]
  post_year_over_year: [post2024, post2025]
  post2025_from_pre2024: [pre2024, post2025]
metadata_audit: departure_and_arrival_sequence_pairs_for_fixed_path_routes_by_period; no_reclassification_from_results
interpretation:
  - 같은 노선·시간의 여러 구간 평균을 더한 진단 지표이며 같은 차량·승객의 실제 경로 통행시간이 아님
  - 원시 단위를 확정하지 않고 사전 평균 대비 지수·증감률만 사용
  - 구간 선택과 합계 질문은 앞선 결과를 본 뒤 정한 탐색이며 독립 검증·인과 효과가 아님
