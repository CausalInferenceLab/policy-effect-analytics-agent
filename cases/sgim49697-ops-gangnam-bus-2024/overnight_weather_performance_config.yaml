# overnight_weather_performance_config.yaml - 실제 기상 상태별 고정 속도 예측의 오류와 구간 포함률
version: 1
mode: exploratory_after_overall_test_metrics
locked_year: 2026
horizons: [1, 3]
weather_audit: results/overnight/persistence_weather/preparation_audit.json
forecast_audit: results/overnight/forecast_baselines/evaluation_audit.json
quantile_models: [catboost_frozen_quantile, weekly_empirical]
quantile_variants: {catboost_frozen_quantile: raw, weekly_empirical: calibration_expanded}
primary_station: 401
stations: [401, 400, 108]
alignment_offset_hours: 0
weather_alignment: 예측 대상 구간 시작 시각에 표시된 공개 1시간 강수·기온; 관측 집계 귀속의 대안 정렬은 다음 조건
rain_groups: {dry: precipitation_equals_zero, wet: precipitation_strictly_positive, unknown: missing}
heat_threshold_c: 30
heat_groups: {below_30: temperature_below_30, at_least_30: temperature_at_least_30, unknown: missing}
slices: [all_hours, evening_17_19]
minimum_rows_for_comparison: 100
minimum_calendar_weeks_for_comparison: 8
bootstrap: {calendar_weeks: 1000, seed: 17}
comparison: 동일 날씨·동일 관측에서 CatBoost와 보정한 주간 경험 분위수의 짝 손실 차이
interpretation:
  - 실제 기상은 시험 오류의 사후 분류에만 쓰며 예측 입력에 추가하거나 날씨 예보를 확보한 것으로 간주하지 않음
  - 강수·고온 집단은 시간대·월·다른 교통 조건도 달라 날씨의 인과 효과로 해석하지 않음
  - 기상 결측을 건조·비고온으로 대체하지 않고 미상 집단을 보고
  - 관측소별 비교는 같은 도로 예측의 반복 분류이며 독립적인 시험이 아님
  - 공식 역사적 기상 품질 플래그와 버스/도로 자료의 실제 공개 지연은 미확보
