# 2025년 속도값을 열기 전에 고정하는 저속 경보·예측구간 실험 규칙.
version: 1
mode: exploratory_protocol_before_new_2025_outcomes
locked_year: 2026
timezone: Asia/Seoul
target: hourly_general_road_speed_not_bus_travel_time
roads: [강남대로, 사평대로, 테헤란로, 봉은사로, 서초대로]
primary_links: ['1220025000', '1220021000', '1220016200']
link_selection:
  training_coverage_minimum: 0.95
  stable_fields: [도로명, 시점명, 종점명, 방향, 거리]
  selection_period: train_only
  later_metadata_changes: mask_changed_period_and_report_not_reselect_by_test_scores
splits:
  train: ['2023-01-01', '2024-12-31']
  tuning: ['2025-01-01', '2025-02-28']
  calibration: ['2025-03-01', '2025-03-31']
  decision: ['2025-04-01', '2025-04-30']
  test: ['2025-05-01', '2025-08-31']
test_gate:
  download_test_after_selection_manifest: true
  required: frozen_feature_schema_models_calibrators_thresholds_and_hashes
  tuning_after_test: prohibited
  iteration_if_failure: record_failure_do_not_adjust_to_improve_test_score
horizons: [1, 3]
origin: integer_hour_t_in_kst
target_interval_start: t_plus_horizon_minus_one_hours
labels:
  primary: speed_strictly_less_than_10_kmh
  relative_sensitivity: speed_strictly_less_than_each_link_training_q20
  missing_target: exclude_and_report_never_impute
availability:
  calendar_only: known_target_calendar_and_link_id
  weekly_delayed:
    target_relative_lags_hours: [168, 336, 504, 672]
    note: 보수적 7일 지연 시나리오. 월 ZIP 당시 발행시각으로 운영 가능성을 입증한 것은 아님.
  recent_road_assumption:
    latest_origin_relative_interval_start_hours: -2
    origin_relative_lags_hours: [2, 3, 4, 24, 48, 168]
    target_relative_lags_hours: [168, 336, 504, 672]
    rolling_hours: [3, 6, 24]
    publication_buffer_hours: 1
    note: 완료된 한 시간 속도가 한 시간 뒤 이용 가능하다고 가정한 회고 모의. 실제 API 지연 검증과 구분.
  delayed_bus_ablation:
    parent: recent_road_assumption
    earliest_target_relative_lag_hours: 168
    source_current_release_days: 5
    source: https://data.seoul.go.kr/dataList/OA-21217/S/1/datasetView.do
    allowed_features: [positive_recorded_time, positive_record_fraction, recorded_trips]
    current_or_future_bus_values: prohibited
  weather:
    future_observations: prohibited
    historical_forecast_not_obtained: exclude_from_primary_models
features:
  known_calendar: [hour, weekday, month, weekend, korean_public_holiday]
  explicit_missing_indicators: true
  numeric_imputer: training_median_only
  target_forward_fill: prohibited
  event_indicator: exclude_from_primary_models
models:
  seasonal_probability:
    groups: [link_id, weekday, hour]
    smoothing_count: 20
  logistic:
    C: [0.1, 1.0, 10.0]
    max_iter: 1500
    class_weight: null
  catboost_classifier:
    depth: [6, 8]
    iterations: 1200
    learning_rate: 0.05
    early_stopping_rounds: 100
    loss_function: Logloss
    selection_metric: average_precision_primary_links_tuning
    processing: CPU
    thread_count: 6
  catboost_quantile:
    feature_set: recent_road_assumption
    depth: [6, 8]
    iterations: 1000
    learning_rate: 0.05
    early_stopping_rounds: 100
    quantiles: [0.1, 0.5, 0.9]
    loss_function: MultiQuantile
    processing: CPU
    thread_count: 6
training:
  seeds: [17, 42]
  primary_seed: 17
  maximum_rows_per_link: 4000
  sampling: deterministic_uniform_without_label_stratification
  refit_on_tuning: false
  repeated_seed: chosen_primary_candidate_only
  resource_budget_hours: 4
calibration:
  method: sigmoid_on_raw_score
  period: calibration
  split_separate_from_decision: true
decision:
  period: decision
  maximum_false_positive_rate: 0.10
  selection: highest_recall_with_fpr_at_or_below_limit
  ties: highest_threshold
evaluation:
  primary: average_precision_on_primary_links
  probability_metrics: [brier, log_loss, roc_auc, prevalence]
  alert_metrics: [precision, recall, false_positive_rate, alerts_per_day]
  interval_metrics: [pinball, empirical_coverage, width, quantile_crossing_rate]
  slices: [all_hours, evening_17_19, per_link, per_month]
  uncertainty: calendar_week_cluster_bootstrap_1000_draws
  missingness: per_split_and_link_coverage
interpretation:
  policy_counterfactual: false
  operational_validation: false
  bus_speed_claim: false
  recent_feature_delay_is_assumed: true
