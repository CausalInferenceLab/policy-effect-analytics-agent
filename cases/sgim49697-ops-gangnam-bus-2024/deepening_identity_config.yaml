# 수집된 역사적 파일의 ID·기준일·좌표 기록을 검증하며 물리적 이동으로 단정하지 않는다.
version: 1
mode: exploratory_metadata_audit
years: [2023, 2024, 2025]
locked_outcome_years: [2026]
station_registry: results/directional/station_registry.csv
route_targets:
  common_highlight: results/overnight/matched_directions/eligibility.csv
  one_direction_highlight: results/overnight/hour_shape/eligibility.csv
  policy_candidate: results/followup/candidate_route_presence.csv
coordinate_policy:
  mode: recorded_numeric_values_only
  equality_tolerance: 0.0000001
  unit: original_numeric_coordinate_unit
  physical_distance_enabled: false
  reason: 공식 목록의 WGS84와 EPSG-5179 표기가 상충한다. 숫자 기록의 차이만 비교하며 미터 거리·실제 승강장 이동으로 변환하지 않는다.
date_policy:
  policy_reference_date: '2024-06-29'
  bracketing: 정책 기준일 전 마지막·이후 첫 실제 수록 기록을 비교하며 같은 날짜면 전체 위치 목록을 우선한다
  annual: STDR_DE 값으로 기준일을 확인한다
  snapshot: 파일명 날짜를 목록 기준일로 사용하되 시설 시행일로 취급하지 않는다
  missing: 관측된 기준일 사이의 값을 보간하지 않는다
  target_absence: 해당 목록의 미수록으로 기록하며 폐지 또는 운행 중단으로 해석하지 않는다
quality:
  xlsx_dimensions: 시트의 선언된 범위를 기록하고 XML 전체 행을 읽는다
  csv_trailing_blank: 이름 없는 마지막 열은 모든 값이 비었을 때만 제거한다
  duplicate_target_key: 중복 키는 자동 선택하거나 평균하지 않고 충돌로 기록한다
