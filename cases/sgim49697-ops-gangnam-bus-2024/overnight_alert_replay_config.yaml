# overnight_alert_replay_config.yaml - 미래 점수·실제값 없이 순서대로 발행하는 경보 제한의 회고 실험
version: 1
mode: exploratory_after_original_test_results
locked_year: 2026
base_config: overnight_forecast_config.yaml
selection: results/overnight/forecast/selected_models_development.json
original_evaluation: results/overnight/forecast/test_evaluation_audit.json
horizons: [1, 3]
labels: [label_10, label_q20]
roles: {label_10: primary_selected, label_q20: training_q20_label_sensitivity}
family: catboost
feature_set: delayed_bus_ablation
seed: 17
warmup: ['2025-04-01', '2025-04-30']
threshold: 원래 4월 FPR 조건으로 고정한 임계값; 새 경보 정책에 맞춰 재선택하지 않음
policies:
  - {name: original, cooldown_hours: 0, daily_cap: null, consecutive_hours: 1}
  - {name: cap2, cooldown_hours: 0, daily_cap: 2, consecutive_hours: 1}
  - {name: cooldown3, cooldown_hours: 3, daily_cap: null, consecutive_hours: 1}
  - {name: cooldown3_cap2, cooldown_hours: 3, daily_cap: 2, consecutive_hours: 1}
  - {name: confirm2_cooldown3_cap2, cooldown_hours: 3, daily_cap: 2, consecutive_hours: 2}
clock: Asia/Seoul의 예측 원점 기준; 모델의 목표 시각과 구별
tie_order: 같은 원점에 알려진 확률 내림차순 후 링크 ID 오름차순; 미래 원점의 점수를 보지 않음
budget_scope: 핵심 3개 링크 합계에 원점 달력 날짜별 상한 적용
cooldown: 같은 링크의 마지막 실제 발행 이후 경과 시간; 억제된 후보는 시간을 다시 시작하지 않음
confirmation: 바로 앞 연속 원점에서도 같은 링크의 원래 임계값 초과 필요; 점수 부재·시간 공백이면 초기화
missing_outcome: 실제 속도가 없는 36개 행도 먼저 예측·발행 판단에 포함; 뒤에 평가 불가로 따로 집계
evaluation:
  target_window: 원래 2025년 5~8월 목표 시각 창; 기존 유효 8820개 예측과 값·라벨·확률 일치 검사
  episodes: 같은 링크에서 라벨 1이 연속한 목표 시각 묶음; 미관측 시각은 연결하지 않음
  episode_hit: 해당 묶음의 관측된 양성 시각 중 하나 이상에 경보 발행
  calendar_day_note: 3시간 예측의 원점은 목표 시각보다 2시간 앞서므로 목표 창 경계의 원점 날짜가 달라짐
interpretation:
  - 이미 본 시험에서 고정 모델에 운영 규칙만 더한 사후 모의실험이며 실제 서비스 또는 새 독립 시험이 아님
  - 경보 감소와 놓친 저속을 함께 공개하며 사용자가 감당할 경보량·손실 비용이 정해진 것으로 간주하지 않음
  - 연속 저속 묶음은 사고·차량 대기행렬 등 외부 사건의 정답이 아님
  - 실제 도로·버스 자료의 원점 가용성은 원래 가정이며 제공 이력이 검증되지 않음
