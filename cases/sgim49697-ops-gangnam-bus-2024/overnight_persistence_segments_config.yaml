# 2025년 방향별 지속성을 인접 정류장 구간과 단일 구간·노선 제외 민감도로 분해한다.
version: 1
mode: exploratory_after_directional_persistence_results
locked_year: 2026
parent_config: overnight_persistence_config.yaml
cohort: frozen_pre2023_pre2024
subset: other_or_unclassified
selection: preserve_original_pre2023_pre2024_cells_and_baseline2024
segments: same_direction_adjacent_registry_order_only
nonadjacent_cells: audit_separately_do_not_reassign
minimum_segment_routes: 3
bands: [morning, midday, evening, late]
comparisons:
  summer2024: [pre2024, post2024]
  summer2025: [pre2025, post2025]
  pre_year_over_year: [pre2024, pre2025]
  post_year_over_year: [post2024, post2025]
  post2025_from_pre2024: [pre2024, post2025]
aggregation: equal_cells
minimum_coverage: 0.80
minimum_days: 20
maximum_coverage_gap: 0.10
bootstrap:
  draws: 2000
  seed: 20261029
intervals: segment_comparisons_evening_only
leave_one_out:
  band: evening
  units: [segment, route]
  selection: remove_each_preselected_unit_once_no_result_based_removal
  normalization: preserve_remaining_original_baselines
  minimum_remaining_routes: 3
  interpretation: 구성 영향 진단이며 제외된 구간·노선의 인과 효과가 아님
station_labels: registry_id_ars_and_order_historical_pairs_checked_not_historical_geometry_proof
interpretation: 구간별 기술적 지속성·집중도이며 최댓값을 사후 주 가설로 확정하지 않음
