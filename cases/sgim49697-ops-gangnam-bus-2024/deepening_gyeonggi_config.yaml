# 경기 공식 연간 노선 이용 자료에서 역사적 ID와 집계 가능 범위를 먼저 확인한다.
version: 1
mode: exploratory_identity_and_demand_audit
years: [2023, 2024, 2025]
locked_year: 2026
catalog_manifest: deepening-reference-sources.json
catalog_ids: [gits_original_catalog, gits_original_catalog_page2]
board_title_contains: 노선별 버스 이용객수
select_attachments: 모든 해당 연도 게시물의 XLSX·ZIP 첨부, 숫자 결과를 보고 선택하지 않음
workers: 2
max_file_mib: 512
max_total_mib: 2048
max_expanded_file_mib: 8192
min_free_gib: 25
validation:
  - 게시물 기준 연도와 자료 내부 기간을 모두 확인하고 2026년 값은 처리하지 않음
  - 노선 ID는 문자열로 보존하고 동일 숫자만으로 다른 ID 체계의 동등성을 단정하지 않음
  - 당시 노선 ID·이름·관할·노선 유형이 있으면 현재 후보 24개와 정확 대응 및 미수록을 모두 기록
  - 합계·평일/주말·단일/환승통행·시간대의 집계 관계와 중복을 먼저 검사
  - 노선 전체의 이용객은 강남역 승차나 개인별 수요로 해석하지 않음
  - 새 이용량 분석의 비교 창·분모·결측·품질 규칙은 스키마 확인 뒤 별도로 고정
  - 원본은 Git 제외 경로에 보존하고 기관 연락·접근 신청 없이 공개 첨부만 사용
