# 근거가 있는 항목만 verified로 변경하고 source와 note를 함께 기록한다.
version: 1
timezone: Asia/Seoul
execution:
  mode: exploratory
  authorization: '2026-10-28 사용자 요청: 시간이 없으니 즉시 데이터 수집부터 학습·결과까지 진행'
  note: 미확인 정의는 가정으로 남긴다. 24시간 대기를 적용하지 않으며 사전 등록 확증 연구로 주장하지 않는다.
metadata_policy:
  allowed_changed_fields: [차선수]
  excluded_links: ['1210007600', '1210007700', '1210008400', '1210008500']
  note: 속도값 확인 전 메타데이터만으로 결정. 시종점 변경 4개 링크 제외. 차선 변경은 원인 미확인으로 기록.
checks:
  hour_semantics:
    status: assumed
    value: interval_end_label
    source: https://topis.seoul.go.kr/refRoom/openRefRoom_1.do
    note: "2023-01~2024-02는 01시/24시, 2024-03~08은 ~01시/~24시 표기. 두 형식이 모두 종료시각인지 공식 확인 필요"
  speed_unit:
    status: assumed
    value: km/h
    source: https://news.seoul.go.kr/traffic/archives/417
    note: 월별 XLSX에 적용되는 단위 확인 필요
  missing_values:
    status: assumed
    value: {blank_is_missing: true, zero: missing, negative: missing, sentinels: ['NULL']}
    source: https://topis.seoul.go.kr/refRoom/openRefRoom_1.do
    note: 탐색 주 분석에서는 0·음수를 결측 처리한다. 2024-08 파일에서 발견한 문자열 NULL도 결측으로 처리한다. 실제 빈도와 0을 유효한 정체로 처리한 정책 민감도를 함께 보고한다.
