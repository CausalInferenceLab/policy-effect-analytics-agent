# 공개 API 설명과 2021년 예시의 필드 대응을 감사하며 측정 단위를 추정하지 않는다.
version: 1
locked_year: 2026
sources:
  - id: tdata_time_api_1039
    manifest: deepening-sources.json
  - id: tdata_operations_api_1083
    manifest: deepening-sources.json
