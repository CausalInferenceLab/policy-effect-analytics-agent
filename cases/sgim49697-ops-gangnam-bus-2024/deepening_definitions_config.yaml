limitations:
  - 날짜 인자와 과거 응답 샘플은 현재 실제 보관·접근 가능 기간을 증명하지 않는다
  - 표기 정규화는 대소문자와 밑줄만 제거하며 필드 의미의 동등성을 판정하지 않는다
  - 표본 숫자의 크기 또는 시각 차이로 다른 자료의 단위·경계·산출식을 확정하지 않는다
  - 인증키 발급·실제 API 요청·2026년 자료값 열람은 수행하지 않는다
