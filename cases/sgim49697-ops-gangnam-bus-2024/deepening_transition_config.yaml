# 이미 본 일반도로 속도의 전환 주간과 고정 날짜·기상 조건별 기술 회귀를 비교한다.
analysis: exploratory_fixed_date_description_not_causal_identification
locked_year: 2026
parent_config: deepening_road_config.yaml
years: [2023, 2024, 2025]
start_month_day: '05-20'
end_month_day: '08-16'
event_month_day: '06-29'
calendar: existing_verified_weekdays_excluding_holidays
group_methods: [fixed_length_arithmetic, equal_cells]
single_links: all_14_original_links_evening_equal_cells
minimum_daily_coverage: 0.80
weekly_minimum_observed_days: 3
weekly_anchor: first_monday_strictly_after_june29_each_year
weekly_reference: same_year_original_pre_window_mean_may20_june28
regressions:
  scopes: all_4_groups_all_4_bands_length_weighted_and_all_14_links_evening
  specifications: [weekday_level, weekday_trend_level, weekday_trend_level_slope]
  outcome: daily_speed_kmh
  post: date_greater_equal_fixed_june29
  time: calendar_days_centered_on_fixed_june29
  post_time: calendar_days_since_fixed_june29_times_post
  minimum_observed_days_each_side: 20
  minimum_observed_fraction: 0.80
  uncertainty: no_standard_errors_pvalues_or_causal_intervals_for_descriptive_fits
  breakpoint_search: prohibited
weather:
  scopes: four_group_evening_length_weighted_only
  sources:
    - {path: results/overnight/weather/daily_bands.csv, audit: results/overnight/weather/audit.json, hash_field: bands_sha256}
    - {path: results/overnight/persistence_weather/daily_bands_2025.csv, audit: results/overnight/persistence_weather/preparation_audit.json, hash_field: outputs}
  stations: [401, 400, 108]
  alignment_offsets_hours: [-1, 0, 1]
  primary_station: 401
  primary_offset: 0
  variables: [log1p_precipitation_mm, temperature_c]
  comparisons: same_complete_rows_trend_level_without_and_with_weather
  missing: drop_only_for_weather_pair_and_report_retention_against_all_valid_speed_days
  interpretation: contemporaneous_reference_weather_for_description_not_available_forecast_inputs_or_full_confounder_control
interpretation:
  - 2023·2025년 6월29일은 같은 계절의 날짜 비교이며 무처치 대조군이나 무작위 위약검정이 아님
  - 전환 주간을 추가해도 같은 날의 버스 조정·공사·GTX 등 개별 원인은 분리되지 않음
  - 월별 메타데이터와 2022·2025년 좌표 감사는 2024년 검지·신호 불변의 증명이 아님
  - 주별 값은 점 기술이며 적은 관측일·부분 주를 표시하고 보간하지 않음
