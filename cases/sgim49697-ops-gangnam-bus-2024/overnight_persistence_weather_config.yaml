# 2025년 연장 결과의 지역 기상 공통 표본을 같은 기존 조건으로 점검한다.
version: 1
mode: exploratory_after_persistence_results
locked_year: 2026
months: ['2025-05', '2025-06', '2025-07', '2025-08']
weather_base_config: overnight_config.yaml
stations: [401, 400, 108]
primary_station: 401
alignment_offsets_hours: [-1, 0, 1]
primary_alignment_offset: 0
primary_scheme: rain_temperature
schemes: [weekday, rain, rain_temperature, rain_temperature_weekday]
temperature_edges_c: [20, 25, 30]
minimum_common_days: 20
minimum_retained_fraction: 0.80
minimum_days_per_stratum: 2
retention_denominator: all_bus_quality_valid_days_in_each_period
unknown_precipitation: keep_unknown
source_claim: public_reference_observation_not_formal_historical_qc
bus_cohort: frozen_pre2023_pre2024
bus_subsets: [all_preselected, other_or_unclassified]
aggregation: equal_cells
periods_from: overnight_persistence_config.yaml
outputs: results/overnight/persistence_weather
raw_hourly: data/overnight/persistence_weather/hourly.parquet
preserve_existing_weather_manifest: true
preserve_existing_weather_outputs: true
download_workers: 2
maximum_response_bytes: 2097152
failed_request: preserve_error_and_missingness_do_not_accept_changed_timestamp
interpretation: 기상 분포 표준화는 기술 비교이며 동시 정책·노선 변경 등 모든 교란을 제거하지 않음
