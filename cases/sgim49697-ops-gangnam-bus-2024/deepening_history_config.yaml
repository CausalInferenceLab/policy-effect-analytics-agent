# 결과를 보기 전에 역사적 정류장·노선 목록의 수집 범위와 해석 조건을 고정한다.
version: 1
mode: exploratory_historical_identity_audit
years: [2023, 2024, 2025]
locked_outcome_years: [2026]
datasets:
  - {id: OA-15067, key: stop_positions, catalog: seoul_stops_15067_sheet}
  - {id: OA-15262, key: route_identity, catalog: seoul_routes_15262}
  - {id: OA-21288, key: median_stops, catalog: seoul_median_stops_21288}
metadata_title_prefix: 컬럼정의
allowed_data_extensions: [.csv, .xlsx]
maximum_file_mib: 25
targets:
  stations: results/directional/station_registry.csv
  common_routes: results/overnight/matched_directions/eligibility.csv
  wider_route_scope: original_selected_routes_and_documented_policy_candidates
interpretation:
  - 게시일과 파일에 표시된 기준일, 실제 시설 변경 시행일을 구분한다
  - 연간 파일은 실제 날짜 열 또는 날짜별 시트를 확인한 뒤에만 월별 기록으로 사용한다
  - 좌표계·단위·행 너비·키 중복·목표 대응을 확인하기 전 좌표 변화를 계산하지 않는다
  - 좌표의 동일성과 승강장·신호·검지 경계의 동일성을 같은 의미로 사용하지 않는다
  - 역사적 자료와 기존 대응이 다르면 차이를 공개하고 기존 결과를 덮어쓰지 않는다
  - 2024년 4월과 8월 사이 자료 공백을 선형 보간해 정책 당일 위치로 만들지 않는다
