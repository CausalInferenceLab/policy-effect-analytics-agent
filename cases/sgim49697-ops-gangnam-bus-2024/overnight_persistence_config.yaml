# 기존 사전 고정 셀을 2025년까지 연장하여 관측 유지율과 방향별 변화의 지속성을 탐색한다.
version: 1
mode: exploratory_after_2025_forecast_features_were_observed
locked_year: 2026
source_scope: forecast_bus_test
months: ['2025-05', '2025-06', '2025-07', '2025-08']
kind: bus_time
selection_path: results/overnight/bus/selected_cells.csv
selection_cohort: common_pre_source_days
groups: [central_south, central_north]
subsets: [all_preselected, other_or_unclassified]
cohorts:
  frozen_pre2023_pre2024: preserve_all_original_cells
  observed_pre2025: restrict_original_cells_to_2025_pre_positive_coverage_at_least_0_80
selection_interpretation: 두 번째 표본은 정책 이후 생존 조건부 집단이며 새 대표 표본 또는 대조군이 아님
normalization: original_cell_baseline_2024_for_all_periods
periods:
  pre2024: ['2024-05-20', '2024-06-28']
  post2024: ['2024-07-08', '2024-08-16']
  pre2025: ['2025-05-20', '2025-06-28']
  post2025: ['2025-07-08', '2025-08-16']
comparisons:
  summer2024: [pre2024, post2024]
  summer2025: [pre2025, post2025]
  pre_year_over_year: [pre2024, pre2025]
  post_year_over_year: [post2024, post2025]
calendar: full_expected_weekdays_excluding_verified_public_holidays
holidays_2025_in_scope: ['2025-05-05', '2025-05-06', '2025-06-03', '2025-06-06', '2025-08-15']
temporary_holiday_source: https://www.korea.kr/news/policyNewsView.do?newsId=148941443
fare_context_source: https://news.seoul.go.kr/traffic/archives/345
bands:
  morning: [7, 8, 9]
  midday: [11, 12, 13, 14]
  evening: [17, 18, 19]
  late: [20, 21, 22]
aggregations: [equal_cells, equal_routes, equal_segments, median_cells]
minimum_coverage: 0.80
minimum_days: 20
maximum_coverage_gap: 0.10
bootstrap_repetitions: 2000
bootstrap_seed: 20261029
intervals: equal_cells_only_calendar_week_resampling
missingness: absent_blank_zero_negative_separate_no_interpolation
historical_identity: verify_2025_central_stop_id_ars_pairs_in_existing_card_identity_audit
interpretation: 2025년은 정책 이후·운임 변경 이후를 포함한 관측 지속성 탐색이며 독립 시험 또는 정책 인과 효과가 아님
