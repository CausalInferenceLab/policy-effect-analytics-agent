# overnight_mechanism_config.yaml - 같은 버스 셀의 시간·운행횟수·승차 기록을 함께 비교하는 탐색 규칙
recorded_at_utc: '2026-10-28T19:45:52Z'
mode: exploratory_after_directional_results
base_config: directional_config.yaml
groups: [central_south, central_north]
segments: 과거 ID·ARS가 확인된 같은 방향의 공간상 바로 이웃한 정류장 쌍만 포함
endpoint_alignments: [arrival, departure]
primary_alignment: arrival
hour_alignment: same_recorded_hour_not_verified_trip_matching
bands_from: overnight_config.yaml
subsets: [all_preselected, other_or_unclassified]
cohort: 두 연도 사전 날짜에서 시간·운행횟수·승차 기록의 관측률 80% 이상과 양수 기준 평균을 모두 충족한 셀
source_calendar: 세 원본에 실제 있는 날짜의 교집합; 날짜 부재를 0으로 채우지 않음
counts: 숫자 0은 유효; 공란·음수·반복 방문은 미확정으로 제외
daily_comparison: 같은 셀·같은 날짜에 세 지표 모두 알려진 관측만으로 각각 사전 평균 100의 지수를 계산
minimum_cell_pre_coverage: 0.80
minimum_daily_coverage: 0.80
minimum_days: 20
maximum_coverage_gap: 0.10
comparisons: [summer2023, summer2024, autumn2024]
aggregation: equal_cells
outputs: 방향·구간별 변화, 공통 표본 유지율, 일별 세 지표, 품질 실패를 모두 보존
interpretation:
  - 사전 공통 관측이 가능한 제한 집단의 기록 지수이며 전체 버스·전체 승객으로 일반화하지 않음
  - 운행횟수·승차 지수가 운행시간 변화의 원인이라는 인과 해석 금지
  - 도착/출발 정렬은 같은 시간의 정류장 기록 연결이며 개별 차량의 추적 매칭이 아님
  - 같은 승객의 여러 구간 중복을 더해 승객 시간·혼잡률을 만들지 않음
