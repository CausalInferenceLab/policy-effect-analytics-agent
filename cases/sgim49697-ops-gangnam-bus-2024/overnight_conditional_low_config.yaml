# 같은 링크·요일·시간의 학습 분포 하위 20% 속도를 별도 탐색 표적으로 고정한다.
version: 1
mode: exploratory_after_unconditional_relative_test_was_observed
locked_year: 2026
base_config: overnight_forecast_config.yaml
horizons: [1, 3]
target_name: label_calendar_q20
target_definition: speed_kmh_strictly_less_than_training_link_weekday_hour_q20
quantile: 0.20
quantile_interpolation: linear
threshold_training: ['2023-01-01', '2024-12-31']
threshold_groups: [link_weekday_hour, link_hour, link]
minimum_threshold_observations: 60
unknown_link: 비교 보류 대신 오류로 중단; 다른 도로의 임계값으로 대체하지 않음
target_interpretation: 같은 요일·시간대의 학습 속도보다 낮은 상태라는 조작적 정의; 사고·비반복 정체·개입 필요성의 정답 라벨이 아님
holidays: 요일 조건은 실제 요일이며 공휴일 여부는 기존 예측 특징으로 유지; 희소 공휴일 별도 임계값은 만들지 않음
feature_sets: [calendar_only, weekly_delayed, recent_road_assumption, delayed_bus_ablation]
model_family: catboost
depth: 8
seed: 17
training_sampling: 원래 링크별 최대 4000개·248000개 고정 표본 규칙
model_selection: 새로운 탐색·튜닝 격자 없이 동일 설정 사용; 원래 개발 기간의 조기 종료만 허용
calibration: 원래 2025년 3월 핵심 링크의 새 라벨과 점수로 시그모이드 보정
decision: 원래 4월 핵심 링크에서 FPR 0.10 이하 최대 재현율, 동률이면 높은 임계값
additional_budget: 원래 4월 평균 달력 하루당 경보 2개 이하·FPR 0.10 이하; 시험에서 일별 상한을 보장하지 않음
paired_comparisons:
  - [weekly_delayed, calendar_only]
  - [recent_road_assumption, weekly_delayed]
  - [delayed_bus_ablation, recent_road_assumption]
evaluation: 기존 2025년 5~8월 핵심 3개 링크, 전체·저녁·월·링크를 모두 보고
target_diagnostics: 링크 전체 분위수·절대 10km/h와의 교집합, 시간별·월별 발생률, 학습 임계값 대체 단계
bootstrap: {calendar_weeks: 1000, seed: 17}
resources: {cpu_threads: 6, maximum_training_hours: 0.75}
interpretation:
  - 이미 관측한 시험의 새 질문이며 독립 시험 또는 기존 모델 성능 향상으로 부르지 않는다.
  - 원래 상대 저속 라벨과 모델·임계값·결과는 보존한다.
  - 저녁 등 반복 패턴만으로 얻은 예측력과 같은 요일·시간 기준 낮은 속도의 예측력을 구별한다.
  - 새 라벨의 시험 성능을 보고 q20·최소 표본·정보 집합·모델 설정을 바꾸지 않는다.
definition_reference: https://www.fhwa.dot.gov/publications/research/operations/16064/004.cfm
