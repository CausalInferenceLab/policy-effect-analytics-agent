# 월별 공개 파일만 쓰는 달력 대비 과거 속도 입력을 같은 모형으로 비교한다.
analysis: exploratory_archive_only_forecast_on_previously_seen_2025
timezone: Asia/Seoul
locked_year: 2026
months: ['2023-01', '2025-12']
primary_links: ['1220025000', '1220021000', '1220016200']
selected_links: results/overnight/forecast/selected_links.json
release_scenario: conservative_guide_and_current_version
release_table: results/deepening/availability/monthly_catalog.csv
horizons: [1, 3]
target_start_offset_hours: horizon_minus_one
splits:
  train: ['2023-01-01', '2024-12-31']
  tuning: ['2025-01-01', '2025-02-28']
  calibration_diagnostic_only: ['2025-03-01', '2025-03-31']
  decision_diagnostic_only: ['2025-04-01', '2025-04-30']
  summer: ['2025-05-11', '2025-08-31']
  autumn: ['2025-09-01', '2025-12-31']
evaluation_origin_not_before: '2025-05-11T00:00:00+09:00'
feature_sets: [calendar_only, published_archive]
target_relative_lags_hours: [1344, 1512, 1680, 1848]
profile_last_published_months: [1, 3]
profile_groups: [link_id, weekday, hour]
profile_statistics: [mean, std, q10, q50, q90, count, expected]
profile_holidays: include_all_source_days_and_use_known_target_holiday_flag
profile_selection: latest_chronological_months_among_already_released_files
unreleased_or_unknown_month: missing_value_with_availability_indicator
metadata_policy: reuse_original_training_link_selection_and_monthly_change_mask
training:
  maximum_rows_per_link: 4000
  sampling: deterministic_uniform_without_target_stratification
  seeds: [17, 42]
  primary_seed: 17
  refit_on_tuning: false
models:
  catboost_quantile:
    depth: 6
    iterations: 1000
    learning_rate: 0.05
    early_stopping_rounds: 100
    quantiles: [0.1, 0.5, 0.9]
    processing: CPU
    thread_count: 2
quantile_postprocessing: sort_three_outputs_and_report_raw_crossings
empirical_baseline:
  name: published_three_month_profile
  minimum_profile_observations: 3
  fallback: training_only_calendar_empirical
  minimum_training_group_rows: 30
calibration: none
alert_threshold_selection: none
evaluation:
  slices: [primary_all_hours, primary_evening_17_19, each_primary_link, each_month]
  metrics: [median_mae, mean_pinball, coverage, width, interval_score_alpha_0.2]
  paired_comparisons: [archive_minus_calendar, archive_minus_profile, profile_minus_calendar]
  week_bootstrap_draws: 2000
  week_bootstrap_seed: 20261029
  minimum_weeks_for_interval: 8
  reselect_on_evaluation: false
resources:
  training_jobs: 1
  threads: 2
  minimum_free_disk_gib: 25
