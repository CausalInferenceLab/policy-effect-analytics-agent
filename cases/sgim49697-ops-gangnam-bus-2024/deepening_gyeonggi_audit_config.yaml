# 대표일 자료의 품질과 노선명 후보를 검사하며 월 총량·역사 ID로 확정하지 않는다.
version: 1
years: [2023, 2024, 2025]
locked_year: 2026
source_manifest: deepening-gyeonggi-sources.json
definition_source: https://gits.gg.go.kr/gtdb/pdfDownload/publicTransport_passengersByRoute.pdf
sampling: 매월 평일 수요일과 주말 토요일 대표 1일씩, 실제 선정 날짜는 첨부에 없음
policy_names: ['1560', '5001', '5001-1', '5002', '5003', '9500', '9501', '9802', 'M7412', '9700', 'M6427', '6427', 'G7426', '3100', 'M4403', '4403', '1551', '1551B', '8501', '8502']
explicit_ab_variants: ['1560', '5001', '5001-1', '5002', '5003']
name_matching: 문자열 정확 일치와 위 명시된 A/B 이름만 후보로 표시; 행정지역·시종점·모든 미수록을 보존
historical_id_verified: false
measurement:
  - 전체통행은 전체승차와 전체하차의 합이며 고유 승객 수가 아님
  - 주간은 07시 이상 19시 미만 12개 시간, 전일은 24개 시간의 합
  - 0·공란·음수·행 부재는 구별하고 없는 시간 칸을 0으로 채우지 않음
  - 실제 대표일을 모르므로 일별 정책 창·날씨·휴일에 결합하지 않음
audit:
  - XLSX 선언 범위를 무시하고 실제 XML 전체 행을 읽음
  - 모든 셀이 비어 있는 XML 서식 행은 개수와 처음/마지막 행 번호를 기록하고 자료 행에서 제외; 일부 값이 있는 잘못된 행은 거절
  - 전체 키 중복과 시종점 설명 제외 키의 값 충돌·반복을 별도 집계
  - SQL에 기록된 통계 연도와 시종점 설명의 노선 마스터 연도를 구분
  - 시종점 제외 동일 값의 하나의 표현은 내부 합계 대조에만 사용하며 노선 ID 통합을 뜻하지 않음
  - 시간 합계 대조는 24개 또는 주간 12개 칸이 모두 관측되고 값 충돌이 없는 경우만 판정
  - 노선명 후보 전체를 보고하고 결과 크기·합계 일치 여부로 후보를 다시 고르지 않음
parser_workers: 1
batch_rows: 40000
min_free_gib: 25
