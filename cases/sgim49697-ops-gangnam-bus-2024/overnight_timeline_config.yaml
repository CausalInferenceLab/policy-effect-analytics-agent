# overnight_timeline_config.yaml - 기존 고정 셀의 장기 궤적과 한 번의 수준 변화 적합 시점을 기술적으로 점검한다.
version: 1
mode: exploratory_after_directional_and_segment_results
locked_year: 2026
range: ['2023-01-01', '2025-08-31']
sources: {development_scope: multiyear, test_scope: forecast_bus_test}
selection: results/overnight/persistence_segments/selected_cells.csv
selection_audit: results/overnight/persistence_segments/audit.json
band: evening
hours: [17, 18, 19]
normalization: preserve_each_selected_cell_baseline_2024
segment_scope: all_14_preselected_adjacent_segments
route_scope:
  - {from_ars: '22011', to_ars: '22009'}
  - {from_ars: '22008', to_ars: '22010'}
route_selection: every_preselected_route_in_the_two_previously_highlighted_segments
aggregations: [equal_cells, median_cells]
minimum_daily_cell_coverage: 0.80
calendar: weekday_exclude_verified_Korean_holidays_keep_absent_dates_in_denominator
holiday_extension_dates: ['2024-12-25', '2025-01-01', '2025-01-27', '2025-01-28', '2025-01-29', '2025-01-30', '2025-03-01', '2025-03-03']
holiday_extension_sources:
  regular_2024: https://astro.kasi.re.kr/file/astro_almanac_pdf/20231023135218580.pdf
  regular_2025: https://www.kasi.re.kr/publication/post/newsMaterial/30071?cPage=8
  temporary_2025_january: https://www.mpm.go.kr/mpm/comm/noti/mpmNotice/?boardId=bbs_0000000000000205&category=&cntId=904&mode=view&pageIdx=3
weekly:
  convention: Monday_to_Sunday
  minimum_valid_days: 3
  minimum_expected_day_coverage: 0.80
  value: mean_of_eligible_daily_indices
single_level_change:
  ranges:
    full: ['2023-01-01', '2025-08-31']
    year2024: ['2024-01-01', '2024-12-31']
  scale: log_of_weekly_index
  minimum_weeks_each_side: 8
  minimum_observed_week_fraction: 0.80
  criterion: minimum_equal_week_weight_two_level_squared_error
  tie_break: earliest_candidate
  interpolation: none
  null_model: single_constant_level
  inference: no_p_value_no_causal_date_no_confidence_interval
policy_reference_date: '2024-06-29'
interpretation:
  - 주간 궤적과 단일 수준 분할의 기술적 요약이며 정책 효과·실제 구조 변화일·검정 결과가 아님
  - 계절·추세·반복 변화·측정 체계 변화가 분할 시점에 영향을 줄 수 있음
  - 같은 ID·구간·사전 셀을 사용하나 새로 표시하는 모든 월의 역사적 물리 위치를 추가 입증한 것은 아님
  - 결과를 본 뒤 기간·최소 주수·구간·노선을 다시 고르지 않으며 탈락도 공개
