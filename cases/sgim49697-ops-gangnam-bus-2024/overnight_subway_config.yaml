# overnight_subway_config.yaml - 강남대로 주변 지하철 카드 기록을 대중교통 수요 맥락으로 비교하는 탐색 규칙
version: 1
mode: exploratory_context_after_bus_results
locked_year: 2026
years: [2023, 2024, 2025]
months_of_year: [1, 2, 3, 4, 5, 6, 7, 8]
probe_month: '2024-05'
datasets: {daily: OA-12914, hourly_month: OA-12252}
stations:
  - {key: gangnam_2, line: 2호선, base_name: 강남, role: primary}
  - {key: sinnonhyeon_9, line: 9호선, base_name: 신논현, role: primary}
  - {key: yangjae_3, line: 3호선, base_name: 양재, role: primary}
  - {key: sinsa_3, line: 3호선, base_name: 신사, role: context}
  - {key: nonhyeon_7, line: 7호선, base_name: 논현, role: context}
  - {key: yeoksam_2, line: 2호선, base_name: 역삼, role: context}
  - {key: seocho_2, line: 2호선, base_name: 서초, role: context}
  - {key: sapyeong_9, line: 9호선, base_name: 사평, role: context}
station_matching: 호선 완전 일치와 역명 끝 괄호 부역명 제거만 허용; 같은 날짜·호선·기본역명 중복이면 자동 합산 금지
missing_operator: 공식 일별 자료 FAQ에 신분당선 미제공 명시; 신분당선·GTX의 실제 승하차 또는 전환 승객으로 해석 금지
daily_periods:
  pre: ['05-20', '06-28']
  post: ['07-08', '08-16']
daily_calendar: 월~금에서 해당 연도 한국 공휴일 제외; 관측 부재일도 예정 날짜 분모에 포함
daily_comparisons:
  summer2023: [pre2023, post2023]
  summer2024: [pre2024, post2024]
  summer2025: [pre2025, post2025]
  pre2024_from_pre2023: [pre2023, pre2024]
  pre2025_from_pre2024: [pre2024, pre2025]
  post2024_from_post2023: [post2023, post2024]
  post2025_from_post2024: [post2024, post2025]
monthly_bands: {morning: [7, 8, 9], evening: [17, 18, 19], late: [20, 21, 22]}
monthly_comparison: 같은 월 전년 대비 일평균 기록; 시간대 자료는 모든 달력 날짜를 포함해 평일 분석과 구분
reconciliation: 같은 역·호선·월·승하차의 일별 합과 전체 시간대 합을 비교; 불일치 원인을 임의 수정하지 않음
minimum_daily_coverage: 0.80
minimum_days: 20
maximum_coverage_gap: 0.10
bootstrap: {draws: 2000, seed: 20261029}
resources: {download_workers: 2, minimum_free_gib: 25, maximum_file_mib: 50}
interpretation:
  - 주변 이용 기록의 맥락이며 버스에서 지하철로 전환한 같은 사람의 경로·정책 효과·무처치 대조군이 아님
  - 일별/월별 자료는 같은 정산 원천의 집계 대조이며 독립 측정 검증이 아님
  - 공개 설명의 운영기관 범위와 원본 실제 호선 목록을 함께 기록; 이름으로 환승역 이용객을 합산하지 않음
  - GTX-A 개통·구성역 개통·기후동행카드·요금·계절 등 동시 변화를 분리하지 않음
