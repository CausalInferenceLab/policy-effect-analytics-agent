# 공식 폐선 이력으로 고정한 노선 구성 민감도와 시간·횟수 기록을 대조한다.
version: 1
mode: exploratory_after_historical_identity_audit
locked_year: 2026
reference_audit: results/overnight/matched_directions/audit.json
reference_config: overnight_matched_directions_config.yaml
history_audit: results/deepening/history/identity_audit.json
history_routes: results/deepening/history/target_route_history.csv
closure_evidence: results/deepening/cohort/closure_evidence.json
record_window: ['2023-01-01', '2025-08-31']
source_scopes: [multiyear, forecast_bus_test]
retired_route:
  id: '100100603'
  name: '542'
  effective_date: '2024-08-24'
  official_source: https://www.gccity.go.kr/portal/newsList/view.do?idx=733&mId=0301140000
  corroborating_source: https://mediahub.seoul.go.kr/archives/2012820
  selection_reason: 새 공식 역사 목록의 미수록 및 공식 폐선일에 근거하며 시간 변화 크기로 제외하지 않는다
cohorts:
  - original_14_reproduction
  - retained_13_same_accepted_dates
  - retained_13_original_coverage_rule
normalization: 원래 동결한 노선·방향·시간별 2024년 사전 평균을 그대로 사용한다
joint_observation: 원래처럼 양방향 7~22시 32개 양수 기록을 같은 노선·날짜에 모두 요구한다
same_dates: 원래 14개 분석에서 통과한 날짜만 사용하는 결과를 별도로 제시한다
native_coverage: 13개 고정 분모에 원래 80퍼센트 관측률 기준을 적용하고 추가 날짜 수를 공개한다
time_count_join:
  endpoints: [departure, arrival]
  alignment: 같은 노선·정류장·날짜·기록 시간; 차량 또는 회차 일치로 해석하지 않는다
  states: [positive, zero, negative, blank, row_absent, source_date_absent]
  source_absence: 원본 추출 감사에서 해당 날짜가 없으면 행 부재와 별도로 기록한다
  zero_count: 횟수 0은 유효 관측이며 시간 0·행 부재와 구별한다
  use: 기록 지원 여부의 기술적 점검이며 이 조건으로 기존 표본을 재선택하지 않는다
reporting:
  all_variants: true
  causal_effect: false
  physical_time_unit_verified: false
  original_files_overwritten: false
