# 고정 예측의 저속 연속 구간·시작 경보를 후속 탐색으로 재평가한다.
analysis: exploratory_reanalysis_of_seen_2025_predictions
timezone: Asia/Seoul
locked_year: 2026
primary_links: ['1220025000', '1220021000', '1220016200']
horizons: [1, 3]
periods:
  summer: ['2025-05-01', '2025-09-01']
  autumn: ['2025-09-01', '2026-01-01']
period_end: exclusive
target_start_offset_hours: horizon_minus_one
candidates:
  relative_probability: [calendar_only, weekly_delayed, recent_road_assumption]
  conditional_probability: [recent_road_assumption]
  conditional_margin: [median_gap, scaled_median_gap]
rules: [original_rule, budget_rule]
cooldown_hours: [0, 3]
minimum_observed_episode_hours: [1, 2]
episode_definition: consecutive_positive_hour_labels_within_link
unknown_hour: break_episode_and_preserve_unknown_onset
left_censored: exclude_from_known_onset_recall
right_censored: retain_known_onset_and_mark_duration_lower_bound
midnight: do_not_split
cooldown_clock: per_link_last_emitted_origin_no_daily_reset
cooldown_initial_state: empty_at_each_evaluation_period
missing_predictions: do_not_reconstruct_or_treat_as_negative
interpretation: descriptive_low_label_runs_not_verified_traffic_incidents
