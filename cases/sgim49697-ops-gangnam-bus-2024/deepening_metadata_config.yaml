# 도로 속도값을 읽지 않고 기존 원본 추출 명세의 전체 속성 이력을 점검한다.
version: 1
locked_year: 2026
months: ['2023-01', '2025-12']
selection_config: deepening_road_config.yaml
fields: [도로명, 시점명, 종점명, 방향, 거리, 차선수, 기능유형구분, 도심/외곽구분, 권역구분]
extraction_manifests:
  - results/overnight/forecast/extraction_development.json
  - results/overnight/forecast/extraction_test.json
  - results/overnight/confirmation/feature_audit.json
scope: 기존 14개 링크 전체·36개월, 이름·길이·차선수 등 기록의 안정성과 실제 공사/차로 운영의 불변성을 구별
daily_scope: 속성별 최초/마지막 날짜·등장 일수만 보존된 명세이므로 복수 속성의 정확한 전환일을 추정하지 않는다
