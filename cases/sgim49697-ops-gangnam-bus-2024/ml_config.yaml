# 결과를 보지 않고 고정한 예측 실험 규약. 정책 반사실 예측으로 해석하지 않는다.
version: 1
context_hours: 168
output_hours: 3
horizons: [1, 3]
max_links: 100
minimum_train_coverage: 0.95
minimum_observed_context: 0.95
forward_fill_limit: 3
required_links: ['1220025000', '1220021000', '1220016200']
splits:
  train: ['2023-01-01', '2024-03-31']
  validation: ['2024-04-01', '2024-04-30']
  pre_test: ['2024-05-01', '2024-06-16']
  transition: ['2024-06-17', '2024-06-30']
  post_test: ['2024-07-01', '2024-08-31']
seeds: [17, 42, 2026]
training:
  max_epochs: 50
  max_steps: 1000
  model_max_steps: {dcrnn: 300, stgcn: 1000}
  validation_interval: 250
  inference_batch_size: 256
  graph_inference_batch_size: 16
  chronos_inference_batch_size: 128
  catboost_max_train_windows: 200000
  sample_seed: 17
  budget_note: 결과 확인 전 고정한 단기 탐색 예산. 수렴·최적 성능 또는 동일 계산량 비교를 주장하지 않는다.
  batch_size: 16
  early_stopping_patience: 5
  learning_rate: 0.001
  selection_seed: 17
  device: cuda
models:
  last_value: {}
  weekly_naive: {}
  weekday_hour_mean: {}
  catboost:
    depth: [6, 8]
    learning_rate: [0.05]
    iterations: 800
    early_stopping_rounds: 80
  dlinear: {moving_avg_window: [25, 49]}
  patchtst: {hidden_size: [64, 128], encoder_layers: 2, n_heads: 4, patch_len: 12, stride: 6}
  chronos2:
    model_id: amazon/chronos-2
    revision: 29ec3766d36d6f73f0696f85560a422f50e8498c
    quantile: 0.5
    group: external_pretraining
  dcrnn: {hidden_size: [32, 64], recurrent_layers: 2, diffusion_steps: 2}
  stgcn: {hidden_size: [32, 64], blocks: 2, temporal_kernel: 3}
metrics:
  primary: mae_h1
  auxiliary: [mae_h3, rmse, evening, gangnam, per_link]
