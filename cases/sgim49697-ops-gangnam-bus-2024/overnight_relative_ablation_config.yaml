# 상대 저속에서 달력·주간 도로·최근 도로·지연 버스 정보의 추가 가치를 같은 학습 설정으로 비교한다.
version: 1
mode: exploratory_after_original_test_and_baseline_results
locked_year: 2026
base_config: overnight_forecast_config.yaml
task: training_link_q20_relative_low_speed
primary_scope: original_three_links
horizons: [1, 3]
feature_sets: [calendar_only, weekly_delayed, recent_road_assumption]
comparator: frozen_delayed_bus_ablation_catboost_q20
family: catboost
depth: 8
seed: 17
training_and_tuning: original_train2023_2024_and_tuning_january_february2025
training_sample: original_deterministic_uniform_max4000_per_link
early_stopping: original_1200_iterations_patience100_no_test_use
probability_calibration: march2025_original_three_links_sigmoid
threshold_selection: april2025_original_fpr_limit_maximum_recall_then_highest_threshold
budget_threshold: april2025_mean_max2_link_hour_alerts_per_calendar_day_and_original_fpr_limit
evaluation: same_already_observed_may_august2025_test_no_new_independent_holdout_claim
slices: [all_hours, evening_17_19, each_primary_link, each_month]
paired_comparisons:
  - [frozen_delayed_bus_ablation, recent_road_assumption]
  - [recent_road_assumption, weekly_delayed]
  - [weekly_delayed, calendar_only]
bootstrap:
  calendar_weeks: 1000
  seed: 17
  scopes: [all_hours, evening_17_19]
interpretation: 특징 집합의 예측적 추가 가치이며 인과 기여나 실제 서비스 제공 지연의 검증이 아님
resources:
  cpu_threads: 6
  maximum_training_hours: 1
preserve_original_freeze: true
preserve_supplement_baseline_manifest: true
