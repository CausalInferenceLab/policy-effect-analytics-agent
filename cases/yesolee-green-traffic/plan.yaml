# 사전 분석 계획. 가정 점검·결과 해석은 계획 커밋과 분석 후 discussion.md에 기록한다.
case_id: yesolee-green-traffic
title: "녹색교통지역 5등급 운행제한이 서울 도심 대기질에 미친 효과"
question: >
  녹색교통지역 5등급 차량 운행제한 과태료 부과(2019-12-01) 이후,
  운행제한 시간(06~21시)의 종로·청계천로 NO₂·PM2.5 농도는
  구역 밖 서울 도로변 측정소와 비교해 시행 전후 주별로 어떻게 달라졌는가?
synthetic_data: false

# 한 행 = 측정소 × 1시간(한국시간).
unit: {name: 도로변 대기질 측정소, id_col: station_id}
time:
  col: hour_idx
  freq: hour
  start: 0
  end: 43823
  datetime_col: datetime
  hour_col: hour
  active_hours: [6, 21]
# 한국시간 2017-01-01 00시 = 0, 2021-12-31 23시 = 43823.
# 원자료는 종료시각 표기: 01시 = 00~01시, 24시 = 23~24시. 1시간을 빼 관측 시작시각으로 변환한다.
# 근거: 대기오염측정망 설치·운영지침(2016), 책자 142쪽(PDF 150쪽).
# https://www.keco.or.kr/download.do?uuid=201701170510459480#page=150
# 운행제한 06~21시는 원자료 07~21시, 변환 후 시작시각 06~20시에 해당한다.
# fetch.py에서 시범 운영기 2019-07-01~11-30(21864~25535)을 모든 측정소에서 제외한다.
# 시간 번호는 제외·결측 후에도 유지하고, 적용 외 시간대도 반증 검사용으로 남긴다.

treatment:
  definition: >
    녹색교통지역 안 종로(111125, 서울 종로구 종로 169)와
    청계천로(111124, 서울 중구 청계천로 184)에 전 기간 treated=1을 부여한다.
    2019-07-01 시범 운영, 2019-12-01 과태료 부과 시작. 운행제한은 매일 06~21시다.
    저감장치 미개발·장착 불가 확인 차량은 2020-12-31까지 단속 유예.
    시범 운영 이전과 과태료 부과 이후를 비교한다.
    근거: https://news.seoul.go.kr/traffic/greentraffic
    과태료 부과 시작 근거: https://news.seoul.go.kr/traffic/archives/502555
  group_col: treated
  treat_time: 25542                  # 한국시간 2019-12-01 06시, 첫 운행제한 시작

control:
  definition: >
    녹색교통지역 밖 서울 도로변 측정소 9곳에 전 기간 treated=0을 부여한다.
    핵심 비교군 4곳: 신촌로(111202), 홍릉로(111154), 영등포로(111232), 도산대로(111263).
    추가 비교군 5곳: 천호대로(111275), 화랑로(111312), 강남대로(111264),
    동작대로 중앙차로(111242), 공항대로(111213).
    본분석은 9곳, 민감도 분석은 핵심 4곳만 사용한다.
    한강대로(111122)·정릉로(111162)는 접근로·우회 교통 영향 우려,
    강변북로(111143)는 자동차전용도로의 배출 특성과 우회 가능성 때문에 본분석에서 제외한다.
    이 3곳의 처치 이후 변화는 우회·확산 가능성을 살피는 별도 결과로 보고한다.
    시흥대로(111282)는 2018년 신설로 분석창 앞부분의 관측이 없어 제외한다.
    경계 거리·관측 및 이전 이력·항목별 자료 길이와 결측률은 커밋 후 적합성 점검으로 보고한다.
    경계 거리나 사전추세 결과에 따라 대조군을 자동 교체·추가하지 않는다.
    자료·가정 점검에서 문제가 발견되면 해석을 보류하고, 설계 변경은 이유를 기록해 별도 커밋한다.
  rationale: >
    같은 서울의 도로변 측정망에서 공통 기상·계절·대기질 변화를 비교한다.
    핵심 4곳은 도심형 상업·업무지구와의 유사성을 점검할 비교 후보로 두고,
    추가 5곳의 외곽 간선·중앙차로·개발지역 등 측정환경 차이 가능성은
    4곳만 쓰는 민감도 분석으로 점검한다.
    이 분류는 설치 이력·경계 거리·도로 특성·개발 이력을 모두 검증한 결과가 아니며,
    대조군에 정책 영향이 없음을 확정한 구분도 아니다. 각 근거는 추가로 확인한다.
    9곳 선정은 자료 길이·도로 및 토지이용·정책 영향 가능성을 기준으로 하며,
    순열추론의 조합 수나 최소 p값만으로 대조군 수를 정하지 않는다.

outcomes:
  - name: 시간별 이산화질소 농도
    col: no2
    definition: 에어코리아 최종확정 시간별 NO₂ 농도.
    unit: ppm
    primary: true
    expected_direction: decrease
  - name: 시간별 초미세먼지 농도
    col: pm25
    definition: 에어코리아 최종확정 시간별 PM2.5 농도.
    unit: µg/m³
    primary: false
    expected_direction: decrease

# 측정소·날짜시간 고정효과를 둔 이벤트 스터디. 주 분석은 06~21시 자료만 사용한다.
# 상대시점은 주 단위. 기준 주는 2019-06-23 06시~06-30 06시(시범 운영 이전)다.
# 시범 운영기 제외로 직전 주(-1)는 주 분석에 관측이 없어 기준으로 쓰지 않는다.
# 창 밖 자료는 삭제되지 않고 -30 이하·12 이상 구간에 각각 묶인다.
# 리포트 평균은 사후 주별 계수의 단순평균이며, 12주 이상 묶음도 한 계수다.
estimator:
  method: event_study
  cluster_col: station_id
  covariates: []
  event_bin: 168
  window: [-30, 12]
  ref_period: -23
  alpha: 0.05

assumptions:
  - name: 측정소 유형과 정책 경계의 일치
    description: >
      처치군은 구역 안, 대조군은 구역 밖 도로변 측정소로 구성한다.
      좌표로 경계 최단거리를 보고하고, 한강대로·정릉로가 2km 이상 떨어져 있어도
      본분석에는 편입하지 않는다. 우회 교통·측정환경의 적합성 근거가 부족하면 해석을 보류한다.
    check: manual
  - name: 관측기간과 자료 품질
    description: >
      측정소·항목별 관측 시작·종료일과 사전/사후 결측률, 이전·환경 변화 이력을 보고한다.
      중복과 식별열 결측은 원인을 해결하기 전 추정하지 않으며, 농도는 결측을 0으로 채우거나 보간하지 않는다.
      공통 품질검사의 농도 결측률 20% 초과 기준에 걸리면 실행을 중단한다.
      순열추론은 해당 결과변수에 결측이 없고 모든 측정소의 관측시점 집합이 같은 경우에만 사용한다.
      조건을 충족하지 못하면 임의로 측정소를 빼거나 군집 표준오차만으로 유의성을 판단하지 않고 보류한다.
    check: manual
  - name: 평행추세
    description: >
      2017-01~2019-06의 일별·월별 집계 추세와 계절·요일·시간대 패턴을 점검한다.
      주 분석과 적용 외 시간대 각각에서 기준 주(-23)에 실제 관측이 있는지 확인한다.
      시범 운영으로 제외된 기간의 계수는 추정하지 않으며, 기준 주와 시행 사이의
      평행추세를 직접 확인할 수 없다는 한계를 기록한다.
      자동 사전계수 결합검정과 시각 점검을 함께 사용하고,
      추세가 명백히 다르거나 비교 근거가 부족하면 판단을 보류한다.
    check: pretrend_test
  - name: 시범 운영 이전의 선반영
    description: 정책 발표·홍보·저공해 조치 이력을 확인해 사전 기간의 선반영 가능성을 점검한다.
    check: manual
  - name: 기상과 동시 정책의 지역별 영향
    description: >
      지역별 기상과 2019-12 시작 미세먼지 계절관리제의 적용 조치·강도 차이를 점검한다.
      2020-01 시영주차장 할증은 녹색교통지역 안팎의 적용 범위가 다르므로
      운행제한과 겹친 영향을 구분할 근거를 확인한다.
      서울 전역 계절관리제 5등급 차량 단속(2020-03 시범, 2020-12 본격 시행)이
      대조 측정소 주변에도 적용되는 점을 검토한다.
      동일한 시기·지역에 겹친 정책을 분리할 근거가 부족하면 운행제한만의 효과라는 해석을 보류한다.
      추가 기상 보정 시 자료·변수·모형을 추정 전에 확정한다.
      근거: https://news.seoul.go.kr/env/archives/504753
      https://news.seoul.go.kr/env/archives/506337
    check: manual
  - name: 코로나와 정책 강도 변화
    description: >
      사전 비교 기간(2017-01~2019-06)을 유지하고, 정책 후를 전체 기간,
      2019-12-01~2020-01-31, 2019-12-01~2020-01-19로 달리한 결과와
      2020년 관측을 제외한 결과를 비교한다.
      첫 국내 확진자가 2020-01-20에 발생했으므로 1월 전체를 코로나 이전으로 부르지 않는다.
      2020년 제외도 2021년의 코로나 영향을 제거하지 않으며,
      단기 비교는 사후 기간이 짧고 계절관리제·주차요금 변화와 여전히 겹친다.
      지역별 활동 변화 차이와 차량별 유예 종료의 영향을 기록한다.
      근거: https://www.korea.kr/news/policyNewsView.do?newsId=156430247
    check: manual
  - name: 대조군 오염과 적은 처치 측정소
    description: >
      대조군 9곳과 핵심 4곳의 결과를 비교하고, 제외한 접근로·우회로 3곳은 별도로 보고한다.
      처치 측정소 2개에 대한 순열추론 조건(균형 패널·동시 도입·후보의 교환 가능성)을
      확인한다. 두 곳은 같은 정책구역에 속하므로 독립된 정책 사례 2개로 간주하지 않는다.
      처치 단위 1~5곳에는 합성통제가 더 적합한 후보이나 공통 모듈은 준비 중이므로,
      무작위화 추론으로 1차 추정하는 설계의 한계를 기록한다.
      군집 표준오차에만 의존하지 않으며, 순열추론의 근거가 부족하면 판단을 보류한다.
    check: manual
  - name: 적용 외 시간대 반증의 타당성
    description: >
      21~다음 날 06시 자료로 같은 이벤트 스터디를 수행한다.
      야간에서도 변화가 유의하면 동시 정책·활동 변화와 주간 효과의 지속 가능성을 점검한다.
      이 검사는 야간 추정의 유의성을 확인하며 주야간 효과 차이를 직접 검정하는 DDD는 아니다.
      비유의한 결과만으로 정책 효과나 야간 영향 부재가 증명되었다고 해석하지 않는다.
    check: manual

# 주 단위 shift: 52주 전인 2018-12-02 06시를 가짜 시행 시각으로 검정한다.
refutations:
  - kind: placebo_time
    params: {shift: 52}
  - kind: placebo_window

# 수동 점검 결과와 계획 변경 사유는 discussion.md에 기록한다.
abstention:
  - {when: pretrend_rejected, verdict: not_identified}
  - {when: staggered_adoption, verdict: not_identified}
  - {when: placebo_significant, verdict: conditional}
  - {when: placebo_window_significant, verdict: conditional}
  - {when: ci_crosses_zero, verdict: conditional}
  - {when: few_clusters, verdict: conditional}
  - {when: few_treated_clusters, verdict: conditional}
  - {when: short_pre_period, verdict: conditional}

# min_pre_periods는 event_bin 단위다. 약 2년의 사전 기간을 105주 기준으로 점검한다.
thresholds: {pretrend_alpha: 0.10, min_clusters: 20, min_pre_periods: 105}

data_sources:
  - name: 에어코리아 최종확정 측정자료
    provider: 한국환경공단·국립환경과학원
    url: "https://www.airkorea.or.kr/web/last_amb_hour_data?pMENU_NO=123"
    license: KOGL-3
    path: data/panel.csv
    notes: >
      원자료: data/raw/<연도>/*.xlsx, 2017-01-01~2021-12-31.
      fetch.py에서 서울·도로변대기만 추출한다.
      측정소코드→station_id, 측정일시→datetime·hour_idx로 변환하고,
      종료시각을 보정한 datetime에서 0~23의 hour를 만든다.
      NO2→no2, PM25→pm25로 변환하고 treated를 부여한다.
      농도 단위는 NO₂ ppm, PM2.5 µg/m³로 확인·통일한다.
      빈칸·-999·무효 관측치는 결측 처리하며 0으로 채우거나 보간하지 않는다.
      측정소×시간 중복은 원인을 확인한 뒤 처리한다.
      원자료·가공 데이터는 커밋하지 않는다.
      이용 조건 확인: https://www.data.go.kr/data/15122830/fileData.do
