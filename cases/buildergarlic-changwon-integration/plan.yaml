# Original local plan 82a0165 preceded some downloads, but NOT a blind PR preregistration.
# Amendment after population, fiscal/source and literature exposure; see README.md.
# FEASIBILITY-ONLY: no panel or valid estimator; do not run make flow with this plan.
# Fiscal numerator, reuse terms, eligible controls and sufficiently clean pre-years are unresolved.
case_id: buildergarlic-changwon-integration
title: "창원·마산·진해 통합과 주민 1인당 행정운영경비 (자료가능성 조사)"
question: >
  2010년 7월 1일 창원·마산·진해 통합 후, 동일 경계로 재구성한 주민 1인당
  행정운영경비(결산)가 비통합 시와 비교해 달라졌는가? 비교 가능 자료 확보 전에는 판정하지 않는다.
synthetic_data: false
unit: {name: 통합경계 재구성 시군구, id_col: region_id}
time: {col: year, freq: year, start: 2008, end: 2012} # 후보 구간; 실제 가용 연도 미확인
treatment:
  definition: "법률 제10052호 제2조: 구 창원·마산·진해 폐지 후 새 창원시 설치 2010-07-01. 2010 결산은 부분노출이므로 전환기로 별도 보류. 정책 공포 2010-03-12."
  group_col: treated
  treat_time: 2011 # 완전한 사후 회계연도 첫해; 2010은 추정에서 제외해야 함
control:
  definition: "동일 기간 비통합 시군구 후보; 실제 명단·경계 변화·통합 논의 노출 미검증"
  rationale: "후보일 뿐. 재정 수준·추세 및 동시 정책을 검증하기 전에는 반사실로 인정하지 않음"
outcomes:
  - name: 주민 1인당 행정운영경비
    col: operating_cost_per_resident
    definition: "동일 회계범위의 연간 결산 행정운영경비(인력운영비+기본경비) 원화 총계 / 동일 경계의 해당 연도 말 주민등록 인구. 예산액·행정운영경비 비중은 대체 불가. 통합 전 3시의 분자와 분모 각각 합산 후 나눔."
    unit: 원/명
    primary: true
    expected_direction: unknown
# Schema currently requires a method from did|event_study|its; no "not_selected"/SCM option.
# The did value below ONLY keeps this feasibility draft schema-valid: it is NOT the selected
# estimator, a runnable design, or authorization to infer from a fabricated/partial panel.
# Do NOT run make flow; revise this field after data gates, method support and mentor review.
# Conditional standard SCM is discussed in README but is not implemented here.
estimator: {method: did, cluster_col: region_id, alpha: 0.05}
assumptions:
  - {name: 경계·회계범위 일치, description: "구 3시의 결산 원자료 합산과 비교시군의 회계분류·연도 정의 일치 여부 수작업 검증", check: manual}
  - {name: 비교가능한 사전추세, description: "처치 이전 추세·선택·간섭·동시 정책을 수작업 점검; 사전 관측 부족 시 판정 보류", check: manual}
refutations:
  - {kind: placebo_time, params: {shift: 2}}
abstention:
  - {when: few_treated_clusters, verdict: conditional, note: "처치 한 경계; 통상 클러스터 유의성 신뢰 곤란"}
  - {when: few_clusters, verdict: conditional}
  - {when: short_pre_period, verdict: conditional}
  - {when: pretrend_rejected, verdict: not_identified}
  - {when: ci_crosses_zero, verdict: conditional}
thresholds: {pretrend_alpha: 0.10, min_clusters: 20, min_pre_periods: 3}
data_sources:
  - name: "지방재정365 행정운영경비 결산 상세 (정확한 표 미확정)"
    provider: "행정안전부 지방재정365"
    url: "https://www.lofin365.go.kr/portal/LF5400000.do"
    license: other
    notes: "라이선스 미확인: 'other'는 허가 표시가 아니라 스키마 임시값. 2008~2012 구3시 결산 지표 가용성 미확인; 다운로드 및 재배포 전 확인 필요."
  - name: "행정동별 주민등록 인구 및 세대현황 (보조 분모)"
    provider: "행정안전부 주민등록 인구통계"
    url: "https://jumin.mois.go.kr/statMonth.do"
    license: other
    notes: "2008년부터 월말 자료 공표. 통계 및 다운로드 이용조건 미확인; 원본 재배포 금지."
