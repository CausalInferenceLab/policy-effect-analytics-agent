name: pages

# main 에 반영되면 정적 대시보드(_site/)를 만들어 GitHub Pages 로 배포한다.
# 최초 1회: Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 선택: Settings → Secrets → Actions 에 넣으면 켜지는 것 (값은 절대 레포에 적지 않는다)
#   LAW_OC                                  법제처 법령·행정규칙·조례 자동 수집 (주제별 법령 온톨로지)
#   NAVER_CLIENT_ID, NAVER_CLIENT_SECRET    '요즘 궁금해하는 주제' 순위에 검색 관심도 추가
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST: 순위·데이터 갱신 후 다시 공개

permissions:
  contents: read
  issues: read      # 사이트 질문(라벨 from-site) 수를 세어 순위에 반영
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LAW_OC: ${{ secrets.LAW_OC }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Refresh law/policy ontology (법제처, optional)
        if: ${{ env.LAW_OC != '' }}
        run: |
          python scripts/refresh_law_snapshots.py
          python scripts/refresh_legal.py || echo "::warning::법제처 수집 일부 실패 — 커밋된 스냅샷으로 빌드합니다"
      - name: Refresh topic ranking (site questions + optional Naver DataLab)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_trends.py
      - run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
