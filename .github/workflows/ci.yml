name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests must never hit external data APIs; keys are intentionally empty.
      DATA_GO_KR_API_KEY: ""
      KOSIS_API_KEY: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check . || echo "::warning::ruff format differences (run 'ruff format .')"
      - name: License check (no GPL/AGPL dependencies)
        run: python scripts/check_licenses.py
      - name: Pytest
        run: pytest -q
      - name: Example flow (offline)
        run: make flow CASE=cases/_example_night_clinic
      - name: Upload flow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-flow
          path: |
            cases/_example_night_clinic/flow_log.json
            cases/_example_night_clinic/run_manifest.json
            cases/_example_night_clinic/report.md
            cases/_example_night_clinic/figures/
          if-no-files-found: warn
          retention-days: 14
