name: legal-watch

# 매주 월요일, 주제와 관련된 법령·행정규칙이 지난 7일 사이 바뀌었는지 확인하고
# 바뀐 것이 있으면 이슈(라벨 law-change)를 엽니다. 구성원 누구나 확인해 topics.yaml events 에 반영합니다.
# 필요: Settings → Secrets → Actions 의 LAW_OC. 없으면 아무것도 하지 않습니다.
on:
  schedule:
    - cron: "7 0 * * 1"   # 매주 월요일 09:07 KST
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지 볼까요"
        default: "7"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      LAW_OC: ${{ secrets.LAW_OC }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Watch law/policy changes
        if: ${{ env.LAW_OC != '' }}
        run: python scripts/watch_legal.py --days "${{ github.event.inputs.days || '7' }}" --open-issue
