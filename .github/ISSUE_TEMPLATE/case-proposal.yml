name: 작업 제안 (트랙 A·B·C)
description: 내가 할 작업과 트랙을 정합니다 — 데이터 온톨로지 · 가설과 분석 · 서비스 개발
title: "[작업] "
labels: ["case-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        세 가지 방식 중 하나를 고릅니다 (가이드: docs/tracks/README.md). 모르는 칸은 "미정"으로 두세요.
        트랙 B(분석)는 결과를 보기 전에 질문을 먼저 적는 것이 목표입니다.
  - type: input
    id: owner
    attributes:
      label: 담당자 GitHub ID
      placeholder: gildong
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: 트랙
      options:
        - A. 데이터 온톨로지 — 공공 이슈와 데이터를 잇는 계보(Lineage)
        - B. 가설과 분석 — 실제 사례로 효과 추정 Cycle
        - C. 서비스 개발 — 분석 데이터로 웹·앱 서비스
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: 주제 · 이슈
      description: catalog/topics.yaml 의 주제나 지금 이슈 id. 새 주제면 이름을 적습니다
      placeholder: housing-regulation / seoul-ltp-1015-2025
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 하려는 것 (한두 문장)
      description: "A: 어떤 이슈를 어떤 데이터로 잇나 · B: 어떤 정책이 무엇을 바꿨나 · C: 누가 무엇을 하려고 쓰는 서비스인가"
      placeholder: 2022년 청년월세 특별지원이 수혜 지역 청년 1인가구의 전출률을 낮췄는가?
    validations:
      required: true
  - type: input
    id: workspace
    attributes:
      label: 내 작업 공간
      placeholder: "A: catalog/lineage/gildong-housing.yaml · B: cases/gildong-housing/ · C: apps/gildong-policy-alarm/"
  - type: textarea
    id: treatment
    attributes:
      label: (B) 처치 — 정책 · 시점 · 대상
      placeholder: 시행일, 적용 지역/집단, 처치 강도
  - type: textarea
    id: control
    attributes:
      label: (B) 대조군
      description: 정책이 없었다면 어땠을지 보여줄 비교 대상
  - type: textarea
    id: data
    attributes:
      label: (A·B) 데이터 출처
      description: 기관/데이터셋 이름과 URL, 기간·단위, 이용 조건(공공누리 유형 등)
  - type: textarea
    id: api
    attributes:
      label: (C) 쓸 API와 화면
      description: api/results.json · lineage.json · topics.json 등 무엇을 읽어 어떤 화면을 만들지
  - type: textarea
    id: link
    attributes:
      label: 함께할 사람·작업
      description: "같은 주제의 다른 트랙 작업이 있으면 이슈 번호나 ID (예: B 분석 #12와 C 서비스 연결)"
  - type: textarea
    id: risks
    attributes:
      label: 우려되는 점
      placeholder: 동시 시행 정책, 사전 추세 불일치, 데이터 단절, 이용 조건 등
