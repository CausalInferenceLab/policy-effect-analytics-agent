name: 사이트 대화에서 온 질문
description: 사이트의 "궁금한 정책 이야기" 대화를 제안으로 올립니다 (보통 사이트 버튼이 자동으로 채워 줍니다)
title: "[사이트 질문] "
labels: ["from-site"]
body:
  - type: markdown
    attributes:
      value: |
        사이트 대화창에서 정리한 질문입니다. 올려 주신 질문은 **요즘 궁금해하는 주제 순위**에 반영되고,
        멘토·멘티가 검토해 새 주제·데이터·분석으로 이어집니다. 개인정보나 API 키는 적지 마세요.
  - type: textarea
    id: question
    attributes:
      label: 궁금한 점
      description: 처음 적은 질문
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: 관련 주제
      description: 사이트가 연결한 주제입니다. 맞지 않으면 고치거나 "새 주제"로 두세요.
      placeholder: 부동산 거래 규제 (housing-transaction-regulation)
  - type: textarea
    id: conversation
    attributes:
      label: 대화 내용
      description: 사이트 대화가 자동으로 들어갑니다. 필요 없는 부분은 지워도 됩니다.
      render: markdown
  - type: textarea
    id: proposal
    attributes:
      label: 정리된 제안
      description: 분석 계획 초안, 새로 찾은 데이터셋, 새 주제의 세 가지(언제·누가·무엇) 등
  - type: checkboxes
    id: consent
    attributes:
      label: 확인
      options:
        - label: 이 내용이 공개 저장소에 올라가는 것을 알고 있습니다. 개인정보나 비밀값은 없습니다.
          required: true
